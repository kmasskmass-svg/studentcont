<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------------------------------------------------------------------
   دفتر المتابعة — تطبيق متابعة المتدربين (نسخة ويب مستقلة - ملف واحد)
   التخزين: localStorage الخاص بمتصفح/جهاز كل مستخدم (بيانات خاصة لكل أستاذ)
--------------------------------------------------------------------- */

const STORAGE_KEY = "trainee-tracker-data-v1";

const uid = (p = "id") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;

const DEFAULT_SECTION = () => ({
  id: uid("sec"),
  name: "",
  absenceLimitPct: 20,
  semesterWeeks: 15,
  lecturesPerWeek: 1,
  dateMode: "both", // "hijri" | "gregorian" | "both"
  students: [],
  sessions: [],
  attendance: {},
  gradeItems: [
    { id: uid("gi"), name: "المشاركة", weight: 20, max: 20 },
    { id: uid("gi"), name: "الاختبار الأول", weight: 30, max: 30 },
    { id: uid("gi"), name: "الاختبار النهائي", weight: 50, max: 50 },
  ],
  grades: {},
  notes: [],
  calendarImage: null, // { dataUrl, name }
  calendarTable: null, // { headers, rows }
  holidays: [], // { name, startDate, endDate }
});

/* تنسيق التاريخ هجري/ميلادي حسب اختيار الشعبة، باستخدام تقويم المتصفح المدمج (بدون مكتبات) */
function formatDateByMode(isoDate, mode) {
  if (!isoDate) return "";
  const d = new Date(isoDate + "T00:00:00");
  if (isNaN(d.getTime())) return isoDate;
  const greg = d.toLocaleDateString("ar-SA-u-ca-gregory", { year: "numeric", month: "2-digit", day: "2-digit" });
  let hijri = "";
  try {
    hijri = d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura", { year: "numeric", month: "2-digit", day: "2-digit" });
  } catch (e) { hijri = ""; }
  if (mode === "hijri") return hijri || greg;
  if (mode === "gregorian") return greg;
  return hijri ? `${hijri} هـ  —  ${greg} م` : greg;
}

const COLORS = {
  ink: "#132A26", ink2: "#1E3F38", paper: "#F4EFE4", paperCard: "#FFFDF8",
  gold: "#B9862F", goldSoft: "#E6C888", line: "#DED2B3",
  good: "#3E7A5E", warn: "#C97A2B", bad: "#A63B34", muted: "#7A7161", late: "#3E6FBF",
};
const PIE_COLORS = ["#B9862F", "#3E7A5E", "#1E3F38", "#C97A2B", "#7A9E8C", "#8C6D3F"];

/* ---------------- تخزين محلي (خاص بكل جهاز/متصفح) ---------------- */

function useStorage() {
  const [data, setDataState] = useState(null);
  const [status, setStatus] = useState("loading");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        setDataState(JSON.parse(raw));
      } else {
        const fresh = { sections: [DEFAULT_SECTION()] };
        setDataState(fresh);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      }
      setStatus("ready");
    } catch (e) {
      setStatus("error");
    }
  }, []);

  const persist = useCallback((next) => {
    setDataState(next);
    setSaving(true);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {}
    setTimeout(() => setSaving(false), 250);
  }, []);

  return { data, setData: persist, status, saving };
}

function sortRows(rows, key, dir) {
  const mult = dir === "desc" ? -1 : 1;
  return [...rows].sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * mult;
    return String(av ?? "").localeCompare(String(bv ?? ""), "ar") * mult;
  });
}

function SortableTh({ label, active, dir, onClick }) {
  return (
    <th style={{ ...thStyle, cursor: "pointer", userSelect: "none" }} onClick={onClick}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
        {label}
        <span style={{ fontSize: 10, color: active ? COLORS.gold : COLORS.line }}>{active ? (dir === "asc" ? "▲" : "▼") : "▲▼"}</span>
      </span>
    </th>
  );
}

function computePlannedTotalLectures(section) {
  const weeks = Number(section.semesterWeeks) || 0;
  const perWeek = Number(section.lecturesPerWeek) || 0;
  return weeks * perWeek;
}

function computeAttendancePct(section, studentSid) {
  const planned = computePlannedTotalLectures(section);
  const recorded = section.sessions.length;
  const total = planned > 0 ? planned : recorded;
  let absent = 0;
  section.sessions.forEach((s) => {
    const st = getAttStatus(section.attendance[`${s.id}:${studentSid}`]);
    if (st === "غائب") absent += 1;
  });
  if (total === 0) return { pct: 0, absentCount: absent, total: 0, recorded };
  return { pct: Math.round((absent / total) * 1000) / 10, absentCount: absent, total, recorded };
}

function computeWeightedTotal(section, studentSid) {
  let earned = 0;
  let weightSum = 0;
  const breakdown = section.gradeItems.map((gi) => {
    const raw = section.grades[`${gi.id}:${studentSid}`];
    const score = typeof raw === "number" ? raw : 0;
    const ratio = gi.max > 0 ? score / gi.max : 0;
    const weighted = ratio * gi.weight;
    earned += weighted;
    weightSum += gi.weight;
    return { name: gi.name, score, max: gi.max, weight: gi.weight, weighted: Math.round(weighted * 100) / 100, has: raw !== undefined };
  });
  return { total: Math.round(earned * 100) / 100, weightSum, breakdown };
}

/* يقرأ ملف Excel (.xlsx/.xls) أو CSV ويستخرج أسماء الأعمدة وصفوف البيانات */
async function parseSpreadsheetFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  const headers = (rows[0] || []).map((h) => String(h ?? "").trim());
  const dataRows = rows.slice(1).filter((r) => Array.isArray(r) && r.some((c) => String(c ?? "").trim() !== ""));
  return { headers, rows: dataRows };
}

/* ---------------- أيقونات SVG بسيطة (بديل عن مكتبة خارجية) ---------------- */

function Icon({ name, size = 16, color = "currentColor", style, onClick, title }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style, onClick, role: onClick ? "button" : undefined };
  const P = (d) => <path d={d} />;
  switch (name) {
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14" /></svg>;
    case "trash": return <svg {...common}><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" /></svg>;
    case "users": return <svg {...common}><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2" /><circle cx="10" cy="7" r="4" /><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" /></svg>;
    case "calendar": return <svg {...common}><path d="M8 2v4M16 2v4M3 10h18" /><rect x="3" y="4" width="18" height="18" rx="2" /></svg>;
    case "award": return <svg {...common}><circle cx="12" cy="8" r="6" /><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12" /></svg>;
    case "note": return <svg {...common}><path d="M21 8V21a2 2 0 01-2 2H5a2 2 0 01-2-2V3a2 2 0 012-2h9l7 7z" /><path d="M16 3v6h6" /></svg>;
    case "chart": return <svg {...common}><path d="M18 20V10M12 20V4M6 20v-6" /></svg>;
    case "x": return <svg {...common}><path d="M18 6L6 18M6 6l12 12" /></svg>;
    case "check": return <svg {...common}><path d="M20 6L9 17l-5-5" /></svg>;
    case "pencil": return <svg {...common}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" /><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>;
    case "chevronRight": return <svg {...common}><path d="M9 18l6-6-6-6" /></svg>;
    case "alert": return <svg {...common}><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" /><path d="M12 9v4M12 17h.01" /></svg>;
    case "upload": return <svg {...common}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><path d="M17 8l-5-5-5 5M12 3v12" /></svg>;
    case "userPlus": return <svg {...common}><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /><circle cx="8.5" cy="7" r="4" /><path d="M20 8v6M23 11h-6" /></svg>;
    case "settings": return <svg {...common}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 007 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" /></svg>;
    case "clipboard": return <svg {...common}><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" /></svg>;
    case "download": return <svg {...common}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><path d="M7 10l5 5 5-5M12 15V3" /></svg>;
    default: return null;
  }
}

/* ---------------- رسوم بيانية مخصّصة بسيطة (بديل عن مكتبة خارجية) ---------------- */

function RadialGauge({ pct, color, size = 150 }) {
  const r = size / 2 - 12;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const offset = c - (clamped / 100) * c;
  return (
    <svg width="100%" viewBox={`0 0 ${size} ${size}`} style={{ display: "block" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EFE9D8" strokeWidth="14" />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
      />
    </svg>
  );
}

function SimpleBarChartH({ data, height = 190 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, height, justifyContent: "center" }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 90, fontSize: 11, color: COLORS.ink, textAlign: "left", flexShrink: 0 }}>{d.name}</div>
          <div style={{ flex: 1, background: "#EFE9D8", borderRadius: 6, overflow: "hidden", height: 16 }}>
            <div style={{ width: `${(d.value / max) * 100}%`, background: d.color || PIE_COLORS[i % PIE_COLORS.length], height: "100%", borderRadius: 6 }} />
          </div>
          <div style={{ width: 40, fontSize: 11, color: COLORS.muted, textAlign: "right" }}>{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function SimpleBarChartV({ data, height = 280 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height, overflowX: "auto", paddingBottom: 30, position: "relative" }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 32px" }}>
          <div style={{ fontSize: 10, color: COLORS.muted, marginBottom: 4 }}>{d.value}</div>
          <div style={{ width: 18, height: `${(d.value / max) * (height - 60)}px`, background: COLORS.gold, borderRadius: "6px 6px 0 0" }} />
          <div style={{
            fontSize: 9.5, color: COLORS.muted, marginTop: 6, transform: "rotate(-35deg)", transformOrigin: "top right",
            whiteSpace: "nowrap", maxWidth: 60, position: "absolute", bottom: -18, textAlign: "right",
          }}>{d.name}</div>
        </div>
      ))}
    </div>
  );
}

function SimplePieChart({ data, size = 200 }) {
  const total = data.reduce((a, d) => a + d.value, 0) || 1;
  let cumulative = 0;
  const r = size / 2;
  const cx = r, cy = r;
  const innerR = r * 0.55;
  const slices = data.map((d, i) => {
    const startAngle = (cumulative / total) * 2 * Math.PI;
    cumulative += d.value;
    const endAngle = (cumulative / total) * 2 * Math.PI;
    const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.sin(startAngle), y1 = cy - r * Math.cos(startAngle);
    const x2 = cx + r * Math.sin(endAngle), y2 = cy - r * Math.cos(endAngle);
    const ix1 = cx + innerR * Math.sin(startAngle), iy1 = cy - innerR * Math.cos(startAngle);
    const ix2 = cx + innerR * Math.sin(endAngle), iy2 = cy - innerR * Math.cos(endAngle);
    const path = `M ${ix1} ${iy1} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix1} ${iy1} Z`;
    return <path key={i} d={path} fill={d.color} />;
  });
  return (
    <svg width="100%" viewBox={`0 0 ${size} ${size}`}>
      {data.every((d) => d.value === 0) ? <circle cx={cx} cy={cy} r={r} fill="#EFE9D8" /> : slices}
    </svg>
  );
}

/* ---------------- UI atoms ---------------- */

function IconBtn({ onClick, title, children, tone = "default", small }) {
  const toneColor = tone === "danger" ? COLORS.bad : tone === "gold" ? COLORS.gold : COLORS.ink2;
  return (
    <button
      onClick={onClick} title={title}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: small ? 30 : 36, height: small ? 30 : 36, borderRadius: 10,
        border: `1px solid ${COLORS.line}`, background: COLORS.paperCard,
        color: toneColor, cursor: "pointer", transition: "all .15s",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.background = "#FBF6EA"; e.currentTarget.style.borderColor = toneColor; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = COLORS.paperCard; e.currentTarget.style.borderColor = COLORS.line; }}
    >
      {children}
    </button>
  );
}

function Badge({ children, tone = "muted" }) {
  const map = {
    good: { bg: "#E9F3EC", c: COLORS.good }, warn: { bg: "#FBEEDD", c: COLORS.warn },
    bad: { bg: "#F7E8E6", c: COLORS.bad }, muted: { bg: "#EFE9D8", c: COLORS.muted },
    gold: { bg: "#F4E7C9", c: "#8A6420" },
  };
  const s = map[tone];
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "3px 10px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, background: s.bg, color: s.c, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}

function TextInput(props) {
  return (
    <input {...props} style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: `1px solid ${COLORS.line}`, background: "#FFFFFF", fontSize: 14, color: COLORS.ink, outline: "none", fontFamily: "inherit", ...(props.style || {}) }} />
  );
}

function SectionCard({ children, style }) {
  return (
    <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: 20, boxShadow: "0 1px 2px rgba(19,42,38,0.04)", ...style }}>
      {children}
    </div>
  );
}

const thStyle = { textAlign: "right", padding: "10px 8px", fontSize: 12.5, color: COLORS.muted, fontWeight: 700 };
const tdStyle = { textAlign: "right", padding: "10px 8px", fontSize: 13.5, color: COLORS.ink, verticalAlign: "middle" };
const primaryBtnStyle = { display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", borderRadius: 9, border: "none", background: COLORS.gold, color: COLORS.ink, fontWeight: 800, fontSize: 13.5, cursor: "pointer" };
const ghostBtnStyle = { display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 9, border: `1px solid ${COLORS.goldSoft}`, background: "transparent", color: "#8A6420", fontWeight: 700, fontSize: 13, cursor: "pointer" };
const shellStyle = { minHeight: "100vh", background: `linear-gradient(180deg, ${COLORS.ink} 0%, ${COLORS.ink2} 220px, ${COLORS.paper} 220px)`, fontFamily: "'Segoe UI', Tahoma, 'Geeza Pro', system-ui, sans-serif" };

function getAttStatus(val) { return val && typeof val === "object" ? val.status : val; }
function statusColor(s) { return s === "حاضر" ? COLORS.good : s === "غائب" ? COLORS.bad : s === "حضور متأخر" ? COLORS.late : COLORS.warn; }
function statusBg(s) { return s === "حاضر" ? "#E9F3EC" : s === "غائب" ? "#F7E8E6" : s === "حضور متأخر" ? "#E8EEFB" : "#FBEEDD"; }

/* ---------------- Import File Modal (اختيار الأعمدة) ---------------- */

function ImportFileModal({ fileName, headers, rows, onClose, onImportStudents }) {
  const [selected, setSelected] = useState(() => new Set(headers));
  const [idCol, setIdCol] = useState(() => headers.find((h) => h.includes("رقم") && h.includes("طالب")) || headers.find((h) => h.includes("جامعي") || h.includes("أكاديمي")) || "");
  const [nameCol, setNameCol] = useState(() => headers.find((h) => h.includes("اسم")) || "");

  const toggle = (h) => {
    setSelected((prev) => { const next = new Set(prev); if (next.has(h)) next.delete(h); else next.add(h); return next; });
  };
  const selectAll = () => setSelected(new Set(headers));
  const selectNone = () => setSelected(new Set());

  const selectedList = headers.filter((h) => selected.has(h));
  const idIdx = headers.indexOf(idCol);
  const nameIdx = headers.indexOf(nameCol);
  const previewRows = rows.slice(0, 8);

  const handleImportStudents = () => {
    if (nameIdx === -1) return;
    const seen = new Set();
    const parsed = [];
    rows.forEach((r) => {
      const name = String(r[nameIdx] ?? "").trim();
      if (!name) return;
      const id = idIdx !== -1 ? String(r[idIdx] ?? "").trim() : "-";
      const key = `${id}|${name}`;
      if (seen.has(key)) return;
      seen.add(key);
      parsed.push({ sid: uid("stu"), id: id || "-", name });
    });
    onImportStudents(parsed);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 860, width: "100%", maxHeight: "90vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>استيراد بيانات من ملف</div>
            <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{fileName}</div>
          </div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>

        <div style={{ fontSize: 13, color: COLORS.muted, margin: "10px 0" }}>
          تم العثور على {headers.length} عمود و {rows.length} صف بيانات. اختر الأعمدة التي تريد عرضها في التطبيق:
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={selectAll} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>تحديد الكل</button>
          <button onClick={selectNone} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>إلغاء التحديد</button>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
          {headers.map((h, i) => (
            <label key={`${h}_${i}`} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", borderRadius: 20, border: `1px solid ${selected.has(h) ? COLORS.gold : COLORS.line}`, background: selected.has(h) ? "#F4E7C9" : COLORS.paperCard, fontSize: 12.5, cursor: "pointer", color: COLORS.ink }}>
              <input type="checkbox" checked={selected.has(h)} onChange={() => toggle(h)} style={{ accentColor: COLORS.gold }} />
              {h || "(بدون اسم)"}
            </label>
          ))}
        </div>

        <SectionCard style={{ padding: 14, marginBottom: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5, color: COLORS.ink, marginBottom: 8 }}>
            لإضافة المتدربين مباشرة إلى الشعبة، حدّد الأعمدة المطابقة ثم اضغط "استيراد كمتدربين":
          </div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
            <div>
              <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>عمود الرقم الأكاديمي</div>
              <select value={idCol} onChange={(e) => setIdCol(e.target.value)} style={{ padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
                <option value="">— بدون —</option>
                {headers.map((h, i) => <option key={`${h}_${i}`} value={h}>{h}</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>عمود اسم الطالب</div>
              <select value={nameCol} onChange={(e) => setNameCol(e.target.value)} style={{ padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
                <option value="">— بدون —</option>
                {headers.map((h, i) => <option key={`${h}_${i}`} value={h}>{h}</option>)}
              </select>
            </div>
            <button onClick={handleImportStudents} disabled={!nameCol} style={{ ...primaryBtnStyle, opacity: nameCol ? 1 : 0.5 }}>
              <Icon name="userPlus" size={15} /> استيراد كمتدربين
            </button>
          </div>
        </SectionCard>

        <div style={{ fontWeight: 700, fontSize: 13.5, color: COLORS.ink, marginBottom: 8 }}>معاينة (أول 8 صفوف) — الأعمدة المختارة فقط</div>
        <div style={{ overflowX: "auto", border: `1px solid ${COLORS.line}`, borderRadius: 10 }}>
          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
                {selectedList.length === 0 ? <th style={thStyle}>لم يتم اختيار أي عمود</th> : selectedList.map((h, i) => <th key={`${h}_${i}`} style={thStyle}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {previewRows.map((r, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  {selectedList.map((h, j) => { const idx = headers.indexOf(h); return <td key={`${h}_${j}`} style={tdStyle}>{String(r[idx] ?? "")}</td>; })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Students Tab ---------------- */

function StudentsTab({ section, updateSection, onOpenStudent }) {
  const [newId, setNewId] = useState("");
  const [newName, setNewName] = useState("");
  const [editingSid, setEditingSid] = useState(null);
  const [editVals, setEditVals] = useState({ id: "", name: "" });
  const [bulkText, setBulkText] = useState("");
  const [showBulk, setShowBulk] = useState(false);
  const fileInputRef = useRef(null);
  const [importData, setImportData] = useState(null);
  const [importError, setImportError] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  const addStudent = () => {
    if (!newName.trim()) return;
    updateSection((s) => ({ ...s, students: [...s.students, { sid: uid("stu"), id: newId.trim() || "-", name: newName.trim() }] }));
    setNewId(""); setNewName("");
  };

  const removeStudent = (sid) => updateSection((s) => ({ ...s, students: s.students.filter((st) => st.sid !== sid) }));

  const startEdit = (st) => { setEditingSid(st.sid); setEditVals({ id: st.id, name: st.name }); };
  const saveEdit = () => {
    updateSection((s) => ({ ...s, students: s.students.map((st) => st.sid === editingSid ? { ...st, id: editVals.id, name: editVals.name } : st) }));
    setEditingSid(null);
  };

  const importBulk = () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    const parsed = lines.map((line) => {
      const parts = line.split(/\t|,|\s{2,}/).map((p) => p.trim()).filter(Boolean);
      if (parts.length >= 2) return { sid: uid("stu"), id: parts[0], name: parts.slice(1).join(" ") };
      return { sid: uid("stu"), id: "-", name: line };
    });
    updateSection((s) => ({ ...s, students: [...s.students, ...parsed] }));
    setBulkText(""); setShowBulk(false);
  };

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError("");
    try {
      const { headers, rows } = await parseSpreadsheetFile(file);
      if (!headers.length) { setImportError("تعذّر العثور على أعمدة في الملف. تأكد أن الصف الأول يحتوي على أسماء الأعمدة."); return; }
      setImportData({ fileName: file.name, headers, rows });
    } catch (err) {
      setImportError("تعذّرت قراءة الملف. تأكد أنه بصيغة Excel (.xlsx/.xls) أو CSV صحيحة.");
    } finally {
      e.target.value = "";
    }
  };

  return (
    <SectionCard>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 16 }}>قائمة المتدربين ({section.students.length})</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleFileChange} />
          <button onClick={() => fileInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> استيراد من ملف Excel / CSV</button>
          <button onClick={() => setShowBulk((v) => !v)} style={ghostBtnStyle}><Icon name="userPlus" size={15} /> استيراد قائمة دفعة واحدة</button>
        </div>
      </div>

      {importError && <div style={{ marginBottom: 14, padding: "10px 14px", background: "#F7E8E6", color: COLORS.bad, borderRadius: 10, fontSize: 13 }}>{importError}</div>}

      {showBulk && (
        <div style={{ marginBottom: 16, padding: 14, background: "#F9F4E7", borderRadius: 12, border: `1px dashed ${COLORS.goldSoft}` }}>
          <div style={{ fontSize: 12.5, color: COLORS.muted, marginBottom: 8 }}>الصق كل طالب في سطر بصيغة: الرقم الأكاديمي ثم الاسم (مفصولة بمسافة أو Tab)</div>
          <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={5} placeholder={"446144915\tأسامه راشد عائض الشهراني\n446180489\tحمد بلغيث حسن الشهري"} style={{ width: "100%", padding: 10, borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13, resize: "vertical" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={importBulk} style={primaryBtnStyle}><Icon name="check" size={14} /> استيراد</button>
            <button onClick={() => setShowBulk(false)} style={ghostBtnStyle}>إلغاء</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ flex: "0 0 160px" }}><TextInput placeholder="الرقم الأكاديمي" value={newId} onChange={(e) => setNewId(e.target.value)} /></div>
        <div style={{ flex: "1 1 220px" }}><TextInput placeholder="اسم المتدرب" value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addStudent()} /></div>
        <button onClick={addStudent} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة</button>
      </div>

      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
              <th style={thStyle}>#</th>
              <SortableTh label="الرقم الأكاديمي" active={sortKey === "id"} dir={sortDir} onClick={() => toggleSort("id")} />
              <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
              <SortableTh label="نسبة الغياب" active={sortKey === "attPct"} dir={sortDir} onClick={() => toggleSort("attPct")} />
              <SortableTh label="الدرجة الموزونة" active={sortKey === "grdTotal"} dir={sortDir} onClick={() => toggleSort("grdTotal")} />
              <th style={thStyle}></th>
            </tr>
          </thead>
          <tbody>
            {(() => {
              const enriched = section.students.map((st) => {
                const att = computeAttendancePct(section, st.sid);
                const grd = computeWeightedTotal(section, st.sid);
                return { ...st, attPct: att.pct, attOver: att.pct >= section.absenceLimitPct, grdTotal: grd.total, grdWeightSum: grd.weightSum };
              });
              const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;
              return rows.map((st, idx) => {
              const over = st.attOver;
              const editing = editingSid === st.sid;
              return (
                <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <td style={tdStyle}>{idx + 1}</td>
                  <td style={tdStyle}>{editing ? <TextInput value={editVals.id} onChange={(e) => setEditVals((v) => ({ ...v, id: e.target.value }))} /> : st.id}</td>
                  <td style={{ ...tdStyle, fontWeight: 700, cursor: "pointer", color: COLORS.ink2 }} onClick={() => !editing && onOpenStudent(st.sid)}>
                    {editing ? <TextInput value={editVals.name} onChange={(e) => setEditVals((v) => ({ ...v, name: e.target.value }))} /> : st.name}
                  </td>
                  <td style={tdStyle}><Badge tone={over ? "bad" : "good"}>{st.attPct}% {over && <Icon name="alert" size={12} />}</Badge></td>
                  <td style={tdStyle}><Badge tone="gold">{st.grdTotal} / {st.grdWeightSum}</Badge></td>
                  <td style={{ ...tdStyle, whiteSpace: "nowrap" }}>
                    <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                      {editing ? <IconBtn onClick={saveEdit} title="حفظ" small><Icon name="check" size={15} /></IconBtn> : <IconBtn onClick={() => startEdit(st)} title="تعديل" small><Icon name="pencil" size={14} /></IconBtn>}
                      <IconBtn onClick={() => removeStudent(st.sid)} title="حذف" tone="danger" small><Icon name="trash" size={14} /></IconBtn>
                    </div>
                  </td>
                </tr>
              );
              });
            })()}
            {section.students.length === 0 && <tr><td colSpan={6} style={{ ...tdStyle, textAlign: "center", color: COLORS.muted, padding: 24 }}>لا يوجد متدربون بعد</td></tr>}
          </tbody>
        </table>
      </div>

      {importData && (
        <ImportFileModal
          fileName={importData.fileName} headers={importData.headers} rows={importData.rows}
          onClose={() => setImportData(null)}
          onImportStudents={(parsed) => { updateSection((s) => ({ ...s, students: [...s.students, ...parsed] })); setImportData(null); }}
        />
      )}
    </SectionCard>
  );
}

/* ---------------- Academic Calendar Tab (التقويم الأكاديمي) ---------------- */

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + "T00:00:00");
  return Math.round((d - today) / 86400000);
}

function CalendarTab({ section, updateSection }) {
  const imgInputRef = useRef(null);
  const tableInputRef = useRef(null);
  const [tableError, setTableError] = useState("");
  const [newHoliday, setNewHoliday] = useState({ name: "", startDate: "", endDate: "" });

  const upcoming = (section.holidays || [])
    .filter((h) => h.startDate && daysUntil(h.startDate) >= -1)
    .map((h) => ({ ...h, days: daysUntil(h.startDate) }))
    .sort((a, b) => a.days - b.days)
    .slice(0, 6);

  const addHoliday = () => {
    if (!newHoliday.name.trim() || !newHoliday.startDate) return;
    updateSection((s) => ({ ...s, holidays: [...(s.holidays || []), { id: uid("hol"), ...newHoliday, name: newHoliday.name.trim() }] }));
    setNewHoliday({ name: "", startDate: "", endDate: "" });
  };
  const removeHoliday = (id) => updateSection((s) => ({ ...s, holidays: (s.holidays || []).filter((h) => h.id !== id) }));

  const handleImageUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      updateSection((s) => ({ ...s, calendarImage: { dataUrl: reader.result, name: file.name } }));
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const parseDocxTable = async (file) => {
    const buf = await file.arrayBuffer();
    const result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
    const parser = new DOMParser();
    const docHtml = parser.parseFromString(result.value, "text/html");
    const table = docHtml.querySelector("table");
    if (!table) throw new Error("no-table");
    const rows = [...table.querySelectorAll("tr")].map((tr) => [...tr.querySelectorAll("th,td")].map((c) => c.textContent.trim()));
    const headers = rows[0] || [];
    const dataRows = rows.slice(1);
    return { headers, rows: dataRows };
  };

  const handleTableUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setTableError("");
    try {
      let parsed;
      if (/\.docx?$/i.test(file.name)) {
        if (!window.mammoth) throw new Error("no-mammoth");
        parsed = await parseDocxTable(file);
      } else {
        parsed = await parseSpreadsheetFile(file);
      }
      if (!parsed.headers.length) throw new Error("empty");
      updateSection((s) => ({ ...s, calendarTable: { fileName: file.name, headers: parsed.headers, rows: parsed.rows } }));
    } catch (err) {
      setTableError("تعذّرت قراءة الملف أو لم يُعثر على جدول بداخله. تأكد أن الملف يحتوي جدولًا واضحًا بصيغة Word (.doc/.docx) أو Excel (.xlsx/.xls/.csv).");
    } finally {
      e.target.value = "";
    }
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <SectionCard style={{ padding: 16, background: "#F9F4E7", border: `1px solid ${COLORS.goldSoft}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Icon name="alert" size={18} color="#8A6420" />
          <div style={{ fontWeight: 800, color: "#8A6420", fontSize: 14.5 }}>تنبيهات الإجازات القادمة</div>
        </div>
        {upcoming.length === 0 ? (
          <div style={{ fontSize: 13, color: COLORS.muted }}>لا توجد إجازات قادمة مُسجَّلة. أضف إجازة من القائمة أدناه لتظهر هنا تلقائيًا كلما اقترب موعدها.</div>
        ) : (
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {upcoming.map((h) => (
              <div key={h.id} style={{ padding: "8px 14px", background: "#FFFDF8", borderRadius: 10, border: `1px solid ${COLORS.goldSoft}` }}>
                <div style={{ fontWeight: 700, fontSize: 13, color: COLORS.ink }}>{h.name}</div>
                <div style={{ fontSize: 11.5, color: COLORS.muted }}>
                  {h.days === 0 ? "تبدأ اليوم" : h.days === 1 ? "تبدأ غدًا" : h.days > 0 ? `تبدأ خلال ${h.days} يومًا` : "جارية الآن"}
                  {" — "}{h.startDate}{h.endDate ? ` إلى ${h.endDate}` : ""}
                </div>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard>
        <div style={{ fontWeight: 800, color: COLORS.ink, marginBottom: 10 }}>إدارة الإجازات والمناسبات</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          <div style={{ flex: "1 1 200px" }}><TextInput placeholder="اسم الإجازة أو المناسبة" value={newHoliday.name} onChange={(e) => setNewHoliday((v) => ({ ...v, name: e.target.value }))} /></div>
          <div><TextInput type="date" value={newHoliday.startDate} onChange={(e) => setNewHoliday((v) => ({ ...v, startDate: e.target.value }))} /></div>
          <div><TextInput type="date" value={newHoliday.endDate} onChange={(e) => setNewHoliday((v) => ({ ...v, endDate: e.target.value }))} /></div>
          <button onClick={addHoliday} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {(section.holidays || []).map((h) => (
            <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: "#F9F4E7", borderRadius: 8 }}>
              <div style={{ fontSize: 13 }}><b>{h.name}</b> — {h.startDate}{h.endDate ? ` إلى ${h.endDate}` : ""}</div>
              <Icon name="trash" size={14} color={COLORS.bad} style={{ cursor: "pointer" }} onClick={() => removeHoliday(h.id)} />
            </div>
          ))}
          {(!section.holidays || section.holidays.length === 0) && <div style={{ fontSize: 12.5, color: COLORS.muted }}>لا توجد إجازات مضافة بعد.</div>}
        </div>
      </SectionCard>

      <SectionCard>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontWeight: 800, color: COLORS.ink }}>صورة التقويم الأكاديمي</div>
          <div>
            <input ref={imgInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleImageUpload} />
            <button onClick={() => imgInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> رفع صورة</button>
          </div>
        </div>
        {section.calendarImage ? (
          <img src={section.calendarImage.dataUrl} alt={section.calendarImage.name} style={{ width: "100%", borderRadius: 10, border: `1px solid ${COLORS.line}` }} />
        ) : (
          <div style={{ textAlign: "center", color: COLORS.muted, padding: 30, fontSize: 13 }}>لم تُرفع صورة بعد.</div>
        )}
      </SectionCard>

      <SectionCard>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontWeight: 800, color: COLORS.ink }}>جدول التقويم (من ملف Word أو Excel)</div>
          <div>
            <input ref={tableInputRef} type="file" accept=".doc,.docx,.xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleTableUpload} />
            <button onClick={() => tableInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> استيراد جدول</button>
          </div>
        </div>
        {tableError && <div style={{ marginBottom: 12, padding: "10px 14px", background: "#F7E8E6", color: COLORS.bad, borderRadius: 10, fontSize: 13 }}>{tableError}</div>}
        {section.calendarTable ? (
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead>
                <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>

function normalizeSaudiPhone(phone) {
  const digits = String(phone || "").replace(/[^\d+]/g, "");
  if (!digits) return null;
  if (digits.startsWith("+966")) return digits;
  if (digits.startsWith("966")) return "+" + digits;
  if (digits.startsWith("05")) return "+966" + digits.slice(1);
  if (digits.startsWith("5") && digits.length === 9) return "+966" + digits;
  if (digits.startsWith("0")) return "+966" + digits.slice(1);
  return digits.startsWith("+") ? digits : "+" + digits;
}

function ContactsTab({ section, updateSection }) {
  const fileInputRef = useRef(null);
  const [importData, setImportData] = useState(null);
  const [importError, setImportError] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [showEmailCompose, setShowEmailCompose] = useState(false);
  const [showPhoneCompose, setShowPhoneCompose] = useState(false);
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  // تعبئة تلقائية فورية: أي متدرب بلا بريد إلكتروني يُنسخ رقمه الأكاديمي مباشرة قبل @tvtc.edu.sa
  useEffect(() => {
    const needsFill = section.students.some((st) => !st.email && String(st.id || "").replace(/\D/g, ""));
    if (!needsFill) return;
    updateSection((s) => ({
      ...s,
      students: s.students.map((st) => {
        if (st.email) return st;
        const digitsId = String(st.id || "").replace(/\D/g, "");
        if (!digitsId) return st;
        return { ...st, email: `${digitsId}@tvtc.edu.sa` };
      }),
    }));
    // eslint-disable-next-line
  }, [section.students.length]);

  const setField = (sid, field, value) => updateSection((s) => ({ ...s, students: s.students.map((st) => st.sid === sid ? { ...st, [field]: value } : st) }));

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError("");
    try {
      const { headers, rows } = await parseSpreadsheetFile(file);
      if (!headers.length) { setImportError("تعذّر العثور على أعمدة في الملف."); return; }
      setImportData({ fileName: file.name, headers, rows });
    } catch (err) {
      setImportError("تعذّرت قراءة الملف. تأكد أنه بصيغة Excel أو CSV صحيحة.");
    } finally {
      e.target.value = "";
    }
  };

  const applyContactImport = (updates) => {
    updateSection((s) => {
      let students = [...s.students];
      updates.forEach((u) => {
        let idx = -1;
        if (u.id) idx = students.findIndex((st) => st.id === u.id);
        if (idx === -1 && u.name) idx = students.findIndex((st) => st.name.trim() === u.name.trim());
        if (idx !== -1) {
          students[idx] = { ...students[idx], email: u.email || students[idx].email || "", phone: u.phone || students[idx].phone || "" };
        } else if (u.name) {
          students.push({ sid: uid("stu"), id: u.id || "-", name: u.name, email: u.email || "", phone: u.phone || "" });
        }
      });
      return { ...s, students };
    });
    setImportData(null);
  };

  const generateDefaultEmails = () => {
    updateSection((s) => ({
      ...s,
      students: s.students.map((st) => {
        if (st.email) return st;
        const digitsId = String(st.id || "").replace(/\D/g, "");
        if (!digitsId) return st;
        return { ...st, email: `${digitsId}@tvtc.edu.sa` };
      }),
    }));
  };

  const exportContacts = () => {
    const header = ["الاسم", "الرقم الأكاديمي", "البريد الإلكتروني", "الجوال"];
    const lines = [header.join(",")];
    section.students.forEach((st) => {
      const row = [st.name, st.id, st.email || "", st.phone || ""].map((v) => `"${String(v).replace(/"/g, '""')}"`);
      lines.push(row.join(","));
    });
    const csv = "\uFEFF" + lines.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `قائمة_التواصل_${(section.name || "الشعبة").replace(/[\\/:*?"<>|]/g, "-")}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const enriched = section.students.map((st) => ({ ...st, email: st.email || "", phone: st.phone || "" }));
  const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;

  return (
    <SectionCard>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 16 }}>قائمة التواصل ({section.students.length})</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleFileChange} />
          <button onClick={() => fileInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> استيراد من ملف Excel / CSV</button>
          <button onClick={generateDefaultEmails} style={ghostBtnStyle} title="يولّد بريدًا بصيغة الرقم الأكاديمي@tvtc.edu.sa لكل من لا يملك بريدًا">
            <Icon name="userPlus" size={15} /> توليد البريد الافتراضي (tvtc.edu.sa)
          </button>
          <button onClick={exportContacts} style={primaryBtnStyle}><Icon name="download" size={15} /> تصدير القائمة</button>
          <button onClick={() => setShowEmailCompose(true)} style={primaryBtnStyle}><Icon name="note" size={15} /> إرسال بريد إلكتروني</button>
          <button onClick={() => setShowPhoneCompose(true)} style={primaryBtnStyle}><Icon name="userPlus" size={15} /> تواصل جماعي (واتساب/رسائل)</button>
        </div>
      </div>

      {importError && <div style={{ marginBottom: 14, padding: "10px 14px", background: "#F7E8E6", color: COLORS.bad, borderRadius: 10, fontSize: 13 }}>{importError}</div>}

      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
              <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
              <SortableTh label="الرقم الأكاديمي" active={sortKey === "id"} dir={sortDir} onClick={() => toggleSort("id")} />
              <SortableTh label="البريد الإلكتروني" active={sortKey === "email"} dir={sortDir} onClick={() => toggleSort("email")} />
              <SortableTh label="الجوال" active={sortKey === "phone"} dir={sortDir} onClick={() => toggleSort("phone")} />
              <th style={thStyle}>تواصل سريع</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((st) => {
              const intlPhone = normalizeSaudiPhone(st.phone);
              const waLink = intlPhone ? `https://wa.me/${intlPhone.replace("+", "")}` : null;
              const tgLink = intlPhone ? `https://t.me/${intlPhone.replace("+", "")}` : null;
              const smsLink = intlPhone ? `sms:${intlPhone}` : null;
              return (
                <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <td style={{ ...tdStyle, fontWeight: 700 }}>{st.name}</td>
                  <td style={tdStyle}>{st.id}</td>
                  <td style={tdStyle}><TextInput type="email" dir="ltr" placeholder="44xxxxxxx@tvtc.edu.sa" value={st.email} onChange={(e) => setField(st.sid, "email", e.target.value)} style={{ minWidth: 190, textAlign: "left" }} /></td>
                  <td style={tdStyle}><TextInput type="tel" dir="ltr" placeholder="05xxxxxxxx" value={st.phone} onChange={(e) => setField(st.sid, "phone", e.target.value)} style={{ minWidth: 140, textAlign: "left" }} /></td>
                  <td style={tdStyle}>
                    {!intlPhone ? (
                      <span style={{ fontSize: 11.5, color: COLORS.muted }}>أدخل رقم جوال</span>
                    ) : (
                      <div style={{ display: "flex", gap: 6 }}>
                        <a href={waLink} target="_blank" rel="noopener noreferrer" title="واتساب" style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: "#E9F3EC", color: "#25A25A", textDecoration: "none", fontWeight: 800, fontSize: 13 }}>W</a>
                        <a href={tgLink} target="_blank" rel="noopener noreferrer" title="تيليجرام" style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: "#E7F1FB", color: "#229ED9", textDecoration: "none", fontWeight: 800, fontSize: 13 }}>T</a>
                        <a href={smsLink} title="رسالة نصية" style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: "#F4E7C9", color: "#8A6420", textDecoration: "none", fontWeight: 800, fontSize: 13 }}>#</a>
                      </div>
                    )}
                  </td>
                </tr>
              );
            })}
            {rows.length === 0 && <tr><td colSpan={5} style={{ ...tdStyle, textAlign: "center", color: COLORS.muted, padding: 24 }}>لا يوجد متدربون بعد</td></tr>}
          </tbody>
        </table>
      </div>

      {importData && (
        <ContactImportModal
          fileName={importData.fileName} headers={importData.headers} rows={importData.rows} students={section.students}
          onClose={() => setImportData(null)} onApply={applyContactImport}
        />
      )}
      {showEmailCompose && <EmailComposeModal students={section.students} onClose={() => setShowEmailCompose(false)} />}
      {showPhoneCompose && <BulkPhoneContactModal students={section.students} onClose={() => setShowPhoneCompose(false)} />}
    </SectionCard>
  );
}

/* ---------------- Attendance Tab ---------------- */

function AttendanceTab({ section, updateSection }) {
  const [newLabel, setNewLabel] = useState("");
  const [newDate, setNewDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [activeSessionId, setActiveSessionId] = useState(section.sessions[section.sessions.length - 1]?.id || null);
  const [sortAlpha, setSortAlpha] = useState(false);
  const [lateEditingSid, setLateEditingSid] = useState(null);
  const [lateTemp, setLateTemp] = useState({ arrivalTime: "", lateMinutes: "" });

  useEffect(() => {
    if (!activeSessionId && section.sessions.length) setActiveSessionId(section.sessions[section.sessions.length - 1].id);
  }, [section.sessions, activeSessionId]);

  const addSession = () => {
    const label = newLabel.trim() || `جلسة ${section.sessions.length + 1}`;
    const s = { id: uid("ses"), label, date: newDate };
    updateSection((sec) => ({ ...sec, sessions: [...sec.sessions, s] }));
    setActiveSessionId(s.id);
    setNewLabel("");
  };

  const removeSession = (id) => {
    updateSection((sec) => ({ ...sec, sessions: sec.sessions.filter((x) => x.id !== id) }));
    if (activeSessionId === id) setActiveSessionId(null);
  };

  const setStatus = (studentSid, status) => {
    updateSection((sec) => ({ ...sec, attendance: { ...sec.attendance, [`${activeSessionId}:${studentSid}`]: status } }));
  };

  const setLateStatus = (studentSid, arrivalTime, lateMinutes) => {
    updateSection((sec) => ({ ...sec, attendance: { ...sec.attendance, [`${activeSessionId}:${studentSid}`]: { status: "حضور متأخر", arrivalTime, lateMinutes } } }));
  };

  const setAllStatus = (status) => {
    if (!activeSessionId) return;
    updateSection((sec) => {
      const nextAtt = { ...sec.attendance };
      sec.students.forEach((st) => { nextAtt[`${activeSessionId}:${st.sid}`] = status; });
      return { ...sec, attendance: nextAtt };
    });
  };

  const setDateMode = (mode) => updateSection((sec) => ({ ...sec, dateMode: mode }));
  const setWeeks = (val) => updateSection((sec) => ({ ...sec, semesterWeeks: val === "" ? "" : Number(val) }));
  const setPerWeek = (val) => updateSection((sec) => ({ ...sec, lecturesPerWeek: val === "" ? "" : Number(val) }));

  const session = section.sessions.find((s) => s.id === activeSessionId);
  const plannedTotal = computePlannedTotalLectures(section);
  const dateMode = section.dateMode || "both";

  const displayStudents = sortAlpha ? [...section.students].sort((a, b) => a.name.localeCompare(b.name, "ar")) : section.students;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <SectionCard style={{ padding: 14 }}>
        <div style={{ fontWeight: 800, marginBottom: 10, color: COLORS.ink, fontSize: 14.5 }}>إعدادات الفصل الدراسي وعرض التاريخ</div>
        <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>عدد أسابيع الفصل الدراسي</div>
            <input type="number" min={0} value={section.semesterWeeks ?? ""} onChange={(e) => setWeeks(e.target.value)} style={{ width: 90, padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />
          </div>
          <div>
            <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>عدد محاضرات الأسبوع</div>
            <input type="number" min={0} value={section.lecturesPerWeek ?? ""} onChange={(e) => setPerWeek(e.target.value)} style={{ width: 90, padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />
          </div>
          <Badge tone="gold">إجمالي محاضرات الفصل: {plannedTotal || "—"}</Badge>
          <div>
            <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>نوع التاريخ المعروض</div>
            <select value={dateMode} onChange={(e) => setDateMode(e.target.value)} style={{ padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
              <option value="gregorian">ميلادي فقط</option>
              <option value="hijri">هجري فقط</option>
              <option value="both">الاثنين معًا</option>
            </select>
          </div>
        </div>
        <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 8 }}>
          عند تحديد عدد الأسابيع والمحاضرات، تُحسب نسبة الغياب لكل متدرب من إجمالي محاضرات الفصل الدراسي كاملًا (وليس فقط من عدد الجلسات المسجَّلة فعليًا حتى الآن).
        </div>
      </SectionCard>

      <div className="rg-attendance">
        <SectionCard style={{ padding: 14, alignSelf: "start" }}>
          <div style={{ fontWeight: 800, marginBottom: 10, color: COLORS.ink }}>الجلسات</div>
          <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
            <TextInput placeholder="تاريخ" type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
            <TextInput placeholder="اسم الجلسة (اختياري)" value={newLabel} onChange={(e) => setNewLabel(e.target.value)} />
            <IconBtn onClick={addSession} title="إضافة جلسة"><Icon name="plus" size={16} /></IconBtn>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 420, overflowY: "auto" }}>
            {section.sessions.slice().reverse().map((s) => (
              <div key={s.id} onClick={() => setActiveSessionId(s.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 10px", borderRadius: 9, cursor: "pointer", background: activeSessionId === s.id ? "#F4E7C9" : "transparent", border: `1px solid ${activeSessionId === s.id ? COLORS.gold : "transparent"}` }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.ink }}>{s.label}</div>
                  <div style={{ fontSize: 11, color: COLORS.muted }}>{formatDateByMode(s.date, dateMode)}</div>
                </div>
                <Icon name="trash" size={13} color={COLORS.bad} style={{ cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); removeSession(s.id); }} />
              </div>
            ))}
            {section.sessions.length === 0 && <div style={{ fontSize: 12.5, color: COLORS.muted }}>أضف أول جلسة لتبدأ تسجيل الحضور</div>}
          </div>
        </SectionCard>

        <SectionCard>
          {!session ? (
            <div style={{ textAlign: "center", color: COLORS.muted, padding: 40 }}>اختر أو أضف جلسة لتسجيل الحضور</div>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
                <div style={{ fontWeight: 800, fontSize: 16, color: COLORS.ink }}>{session.label} — {formatDateByMode(session.date, dateMode)}</div>
                <button onClick={() => setSortAlpha((v) => !v)} style={{ ...ghostBtnStyle, padding: "6px 12px", fontSize: 12.5 }}>
                  {sortAlpha ? "إلغاء الترتيب الأبجدي" : "ترتيب الأسماء أبجديًا"}
                </button>
              </div>

              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, padding: "10px 12px", background: "#F9F4E7", borderRadius: 10, border: `1px dashed ${COLORS.goldSoft}` }}>
                <span style={{ fontSize: 12.5, color: COLORS.muted, alignSelf: "center" }}>إجراء سريع لكل المتدربين:</span>
                <button onClick={() => setAllStatus("حاضر")} style={{ padding: "6px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.good}`, background: "#E9F3EC", color: COLORS.good }}>تحضير الكل</button>
                <button onClick={() => setAllStatus("غائب")} style={{ padding: "6px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.bad}`, background: "#F7E8E6", color: COLORS.bad }}>تغييب الكل</button>
                <button onClick={() => setAllStatus("مستأذن")} style={{ padding: "6px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.warn}`, background: "#FBEEDD", color: COLORS.warn }}>استئذان الكل</button>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {displayStudents.map((st) => {
                  const rawCur = section.attendance[`${session.id}:${st.sid}`] || null;
                  const cur = getAttStatus(rawCur);
                  const lateInfo = rawCur && typeof rawCur === "object" ? rawCur : null;
                  const editingLate = lateEditingSid === st.sid;
                  return (
                    <div key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}`, padding: "8px 4px" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                        <div style={{ fontSize: 14, color: COLORS.ink }}>
                          {st.name} <span style={{ color: COLORS.muted, fontSize: 12 }}>({st.id})</span>
                          {lateInfo && (
                            <div style={{ fontSize: 11, color: COLORS.late, marginTop: 2 }}>
                              وصل الساعة {lateInfo.arrivalTime || "—"} — تأخر {lateInfo.lateMinutes || 0} دقيقة
                            </div>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                          {["حاضر", "غائب", "مستأذن"].map((opt) => (
                            <button key={opt} onClick={() => { setStatus(st.sid, opt); setLateEditingSid(null); }} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1px solid ${cur === opt ? statusColor(opt) : COLORS.line}`, background: cur === opt ? statusBg(opt) : "#fff", color: cur === opt ? statusColor(opt) : COLORS.muted }}>{opt}</button>
                          ))}
                          <button
                            onClick={() => {
                              if (editingLate) { setLateEditingSid(null); return; }
                              setLateTemp({ arrivalTime: lateInfo?.arrivalTime || "", lateMinutes: lateInfo?.lateMinutes ?? "" });
                              setLateEditingSid(st.sid);
                            }}
                            style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer", border: `1px solid ${cur === "حضور متأخر" ? statusColor("حضور متأخر") : COLORS.line}`, background: cur === "حضور متأخر" ? statusBg("حضور متأخر") : "#fff", color: cur === "حضور متأخر" ? statusColor("حضور متأخر") : COLORS.muted }}
                          >
                            حضور متأخر
                          </button>
                        </div>
                      </div>
                      {editingLate && (
                        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end", marginTop: 10, padding: "10px 12px", background: "#EEF2FB", borderRadius: 9, border: `1px dashed ${COLORS.late}` }}>
                          <div>
                            <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 4 }}>وقت الحضور</div>
                            <input type="time" value={lateTemp.arrivalTime} onChange={(e) => setLateTemp((v) => ({ ...v, arrivalTime: e.target.value }))} style={{ padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}` }} />
                          </div>
                          <div>
                            <div style={{ fontSize: 11.5, color: COLORS.muted, marginBottom: 4 }}>عدد دقائق التأخير</div>
                            <input type="number" min={0} value={lateTemp.lateMinutes} onChange={(e) => setLateTemp((v) => ({ ...v, lateMinutes: e.target.value }))} style={{ width: 90, padding: "7px 10px", borderRadius: 8, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />
                          </div>
                          <button
                            onClick={() => { setLateStatus(st.sid, lateTemp.arrivalTime, lateTemp.lateMinutes === "" ? 0 : Number(lateTemp.lateMinutes)); setLateEditingSid(null); }}
                            style={{ ...primaryBtnStyle, background: COLORS.late, color: "#fff" }}
                          >
                            <Icon name="check" size={14} /> حفظ
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </SectionCard>
      </div>
    </div>
  );
}


/* ---------------- Grades Tab ---------------- */

function GradesTab({ section, updateSection }) {
  const [newItem, setNewItem] = useState({ name: "", weight: "", max: "" });
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };
  const weightTotal = section.gradeItems.reduce((a, g) => a + g.weight, 0);

  const addItem = () => {
    if (!newItem.name.trim() || !newItem.weight || !newItem.max) return;
    updateSection((s) => ({ ...s, gradeItems: [...s.gradeItems, { id: uid("gi"), name: newItem.name.trim(), weight: Number(newItem.weight), max: Number(newItem.max) }] }));
    setNewItem({ name: "", weight: "", max: "" });
  };

  const removeItem = (id) => updateSection((s) => ({ ...s, gradeItems: s.gradeItems.filter((g) => g.id !== id) }));

  const setScore = (itemId, studentSid, value) => {
    const num = value === "" ? undefined : Number(value);
    updateSection((s) => ({ ...s, grades: { ...s.grades, [`${itemId}:${studentSid}`]: num } }));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <SectionCard>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 15 }}>بنود التقييم</div>
          <Badge tone={weightTotal === 100 ? "good" : "warn"}>مجموع الأوزان: {weightTotal}%</Badge>
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
          {section.gradeItems.map((gi) => (
            <div key={gi.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: "#F9F4E7", borderRadius: 10, border: `1px solid ${COLORS.goldSoft}` }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink }}>{gi.name}</div>
                <div style={{ fontSize: 11, color: COLORS.muted }}>وزن {gi.weight}% · من {gi.max}</div>
              </div>
              <Icon name="trash" size={13} color={COLORS.bad} style={{ cursor: "pointer" }} onClick={() => removeItem(gi.id)} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 180px" }}><TextInput placeholder="اسم البند (مثال: اختبار قصير)" value={newItem.name} onChange={(e) => setNewItem((v) => ({ ...v, name: e.target.value }))} /></div>
          <div style={{ width: 110 }}><TextInput placeholder="الوزن %" type="number" value={newItem.weight} onChange={(e) => setNewItem((v) => ({ ...v, weight: e.target.value }))} /></div>
          <div style={{ width: 110 }}><TextInput placeholder="الدرجة القصوى" type="number" value={newItem.max} onChange={(e) => setNewItem((v) => ({ ...v, max: e.target.value }))} /></div>
          <button onClick={addItem} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة بند</button>
        </div>
      </SectionCard>

      <SectionCard>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 15, marginBottom: 12 }}>سجل الدرجات</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
                <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
                {section.gradeItems.map((gi) => (
                  <SortableTh key={gi.id} label={`${gi.name} (من ${gi.max})`} active={sortKey === gi.id} dir={sortDir} onClick={() => toggleSort(gi.id)} />
                ))}
                <SortableTh label="الإجمالي الموزون" active={sortKey === "grdTotal"} dir={sortDir} onClick={() => toggleSort("grdTotal")} />
              </tr>
            </thead>
            <tbody>
              {(() => {
                const enriched = section.students.map((st) => {
                  const grd = computeWeightedTotal(section, st.sid);
                  const row = { ...st, grdTotal: grd.total };
                  section.gradeItems.forEach((gi) => { row[gi.id] = section.grades[`${gi.id}:${st.sid}`] ?? -1; });
                  return row;
                });
                const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;
                return rows.map((st) => {
                const grd = computeWeightedTotal(section, st.sid);
                return (
                  <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                    <td style={{ ...tdStyle, fontWeight: 700 }}>{st.name}</td>
                    {section.gradeItems.map((gi) => (
                      <td key={gi.id} style={tdStyle}>
                        <input type="number" min={0} max={gi.max} value={section.grades[`${gi.id}:${st.sid}`] ?? ""} onChange={(e) => setScore(gi.id, st.sid, e.target.value)} style={{ width: 66, padding: "6px 8px", borderRadius: 7, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />
                      </td>
                    ))}
                    <td style={tdStyle}><Badge tone="gold">{grd.total}</Badge></td>
                  </tr>
                );
                });
              })()}
            </tbody>
          </table>
        </div>
      </SectionCard>
    </div>
  );
}

/* ---------------- Notes Tab ---------------- */

function NotesTab({ section, updateSection }) {
  const [studentSid, setStudentSid] = useState(section.students[0]?.sid || "");
  const [text, setText] = useState("");

  const addNote = () => {
    if (!text.trim() || !studentSid) return;
    const note = { id: uid("note"), studentSid, date: new Date().toISOString().slice(0, 10), text: text.trim() };
    updateSection((s) => ({ ...s, notes: [note, ...s.notes] }));
    setText("");
  };
  const removeNote = (id) => updateSection((s) => ({ ...s, notes: s.notes.filter((n) => n.id !== id) }));

  return (
    <div className="rg-notes">
      <SectionCard style={{ alignSelf: "start" }}>
        <div style={{ fontWeight: 800, color: COLORS.ink, marginBottom: 12 }}>إضافة ملاحظة</div>
        <div style={{ marginBottom: 10 }}>
          <select value={studentSid} onChange={(e) => setStudentSid(e.target.value)} style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: `1px solid ${COLORS.line}`, fontSize: 14 }}>
            {section.students.map((st) => <option key={st.sid} value={st.sid}>{st.name}</option>)}
          </select>
        </div>

/* ---------------- Reports Tab ---------------- */

function ReportsTab({ section, onOpenStudent }) {
  const rows = section.students.map((st) => {

    const grd = computeWeightedTotal(section, st.sid);
    return { st, att, grd };

  const barData = rows.map((r) => ({ name: r.st.name.split(" ")[0], value: r.grd.total })).slice(0, 25);

/* ---------------- Section Manager Modal ---------------- */

function SectionManagerModal({ data, setData, activeSectionId, setActiveSectionId, onClose }) {
  const [newName, setNewName] = useState("");

  const addSection = () => {
    if (!newName.trim()) return;
    const sec = { ...DEFAULT_SECTION(), name: newName.trim(), students: [] };
    setData({ ...data, sections: [...data.sections, sec] });
    setActiveSectionId(sec.id);
    setNewName("");
  };

  const removeSection = (id) => {
    if (data.sections.length <= 1) return;
    const next = data.sections.filter((s) => s.id !== id);
    setData({ ...data, sections: next });
    if (activeSectionId === id) setActiveSectionId(next[0]?.id || null);
  };

  const renameSection = (id, name) => setData({ ...data, sections: data.sections.map((s) => s.id === id ? { ...s, name } : s) });
  const setLimit = (id, val) => setData({ ...data, sections: data.sections.map((s) => s.id === id ? { ...s, absenceLimitPct: Number(val) } : s) });

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 560, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>إدارة الشعب</div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          {data.sections.map((s) => (
            <SectionCard key={s.id} style={{ padding: 12 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                <TextInput value={s.name} onChange={(e) => renameSection(s.id, e.target.value)} />
                <IconBtn onClick={() => removeSection(s.id)} title="حذف الشعبة" tone="danger" small><Icon name="trash" size={14} /></IconBtn>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: COLORS.muted }}>
                حد نسبة الغياب المسموح:
                <input type="number" value={s.absenceLimitPct} onChange={(e) => setLimit(s.id, e.target.value)} style={{ width: 60, padding: "5px 8px", borderRadius: 7, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />%
                <span style={{ marginRight: "auto" }}>{s.students.length} متدرب</span>
              </div>
            </SectionCard>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8 }}>
          <TextInput placeholder="اسم الشعبة الجديدة" value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSection()} />
          <button onClick={addSection} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة شعبة</button>
        </div>
      </div>
    </div>
  );
}

function TopBar({ saving, section, sections, onSwitch, onManage, onExport, onImportClick, onOpenReportExport }) {
  const dragRef = useRef(null);
  const dragState = useRef({ down: false, startX: 0, startScroll: 0, moved: false });

  const onDragStart = (clientX) => {
    const el = dragRef.current;
    if (!el) return;
    dragState.current = { down: true, startX: clientX, startScroll: el.scrollLeft, moved: false };
  };
  const onDragMove = (clientX) => {
    const el = dragRef.current;
    if (!el || !dragState.current.down) return;
    const dx = clientX - dragState.current.startX;
    if (Math.abs(dx) > 3) dragState.current.moved = true;
    el.scrollLeft = dragState.current.startScroll - dx;
  };
  const onDragEnd = () => { dragState.current.down = false; };
  const suppressClickIfDragged = (e) => { if (dragState.current.moved) { e.preventDefault(); e.stopPropagation(); } };

  const actions = [
    { key: "manage", icon: "settings", label: "إدارة الشعب", onClick: onManage, tone: "ghost" },
    { key: "reportExport", icon: "note", label: "تصدير تقرير", onClick: onOpenReportExport, tone: "ghost" },
    { key: "backupExport", icon: "download", label: "تصدير نسخة احتياطية", onClick: onExport, tone: "gold" },
    { key: "backupImport", icon: "upload", label: "استيراد نسخة احتياطية", onClick: onImportClick, tone: "ghost" },
  ];

  const actionBtnStyle = (tone) => ({
    display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 10,
    border: `1px solid ${COLORS.goldSoft}`,
    background: tone === "gold" ? COLORS.gold : "transparent",
    color: tone === "gold" ? COLORS.ink : COLORS.goldSoft,
    fontSize: 13.5, cursor: "pointer", fontWeight: tone === "gold" ? 800 : 700, whiteSpace: "nowrap",
  });

  return (
    <div className="app-container" style={{ maxWidth: 1180, margin: "0 auto", padding: "26px 22px 0" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "nowrap", gap: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          <div style={{ width: 44, height: 44, borderRadius: 12, background: COLORS.gold, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon name="clipboard" size={22} color={COLORS.ink} />
          </div>
          <div>
            <div className="topbar-title" style={{ color: COLORS.paper, fontSize: 20, fontWeight: 800, letterSpacing: 0.2, whiteSpace: "nowrap" }}>دفتر المتابعة</div>
            <div style={{ color: section?.name ? "#F0DFAE" : "#C9BFA0", fontSize: 13, fontWeight: section?.name ? 700 : 400, whiteSpace: "nowrap" }}>
              {section?.name ? section.name : "لم تُسمَّ الشعبة بعد"}
            </div>
          </div>
        </div>

        <div
          ref={dragRef}
          className="drag-scroll-row"
          onMouseDown={(e) => onDragStart(e.clientX)}
          onMouseMove={(e) => onDragMove(e.clientX)}
          onMouseUp={onDragEnd}
          onMouseLeave={onDragEnd}
          onClickCapture={suppressClickIfDragged}
          style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "nowrap", overflowX: "auto", flex: "1 1 auto", minWidth: 0 }}
        >
          <div style={{ fontSize: 12, color: saving ? COLORS.goldSoft : "#9FB8A9", minWidth: 78, textAlign: "center", flexShrink: 0 }}>{saving ? "جارِ الحفظ..." : "محفوظ ✓"}</div>
          <select value={section?.id || ""} onChange={(e) => onSwitch(e.target.value)} style={{ padding: "9px 12px", borderRadius: 10, border: `1px solid ${COLORS.goldSoft}`, background: "#1E3F38", color: COLORS.paper, fontSize: 13.5, minWidth: 160, flexShrink: 0 }}>
            {sections.map((s) => <option key={s.id} value={s.id}>{s.name || "(بدون اسم)"}</option>)}
          </select>
          {actions.map((a) => (
            <button key={a.key} onClick={a.onClick} title={a.label} style={{ ...actionBtnStyle(a.tone), flexShrink: 0 }}>
              <Icon name={a.icon} size={16} /> {a.label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function StatCard({ iconName, label, value, tone }) {
  const color = tone === "bad" ? COLORS.bad : tone === "good" ? COLORS.good : COLORS.ink;
  return (
    <div className="stat-card" style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: "14px 18px", minWidth: 175, flex: "1 1 175px", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 6px 16px rgba(19,42,38,0.08)" }}>
      <div style={{ width: 38, height: 38, borderRadius: 10, background: "#F4E7C9", display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.gold, flexShrink: 0 }}>
        <Icon name={iconName} size={18} />
      </div>
      <div>
        <div style={{ fontSize: 21, fontWeight: 800, color }}>{value}</div>
        <div style={{ fontSize: 12, color: COLORS.muted }}>{label}</div>
      </div>

}

function SectionHeader({ section }) {
  const total = section.students.length;
  const overLimit = section.students.filter((st) => computeAttendancePct(section, st.sid).pct >= section.absenceLimitPct).length;
  const avgTotal = total ? Math.round((section.students.reduce((acc, st) => acc + computeWeightedTotal(section, st.sid).total, 0) / total) * 10) / 10 : 0;
  return (
    <div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <StatCard iconName="users" label="عدد المتدربين" value={total} />
        <StatCard iconName="calendar" label="عدد الجلسات المسجّلة" value={section.sessions.length} />
        <StatCard iconName="alert" label={`تجاوزوا حد الغياب (${section.absenceLimitPct}%)`} value={overLimit} tone={overLimit > 0 ? "bad" : "good"} />
        <StatCard iconName="award" label="متوسط الدرجة الموزونة" value={avgTotal} />
      </div>
    </div>
  );
}
