<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------------------------------------------------------------------
   دفتر المتابعة — تطبيق متابعة المتدربين (نسخة ويب مستقلة - ملف واحد)
   التخزين: localStorage الخاص بمتصفح/جهاز كل مستخدم (بيانات خاصة لكل أستاذ)
--------------------------------------------------------------------- */

const STORAGE_KEY = "trainee-tracker-data-v1";

const uid = (p = "id") => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;

const DEFAULT_SECTION = () => ({
  id: uid("sec"),
  name: "",
  absenceLimitPct: 20,
  students: [],
  sessions: [],
  attendance: {},
  gradeItems: [
    { id: uid("gi"), name: "المشاركة", weight: 20, max: 20 },
    { id: uid("gi"), name: "الاختبار الأول", weight: 30, max: 30 },
    { id: uid("gi"), name: "الاختبار النهائي", weight: 50, max: 50 },
  ],
  grades: {},
  notes: [],
});

const COLORS = {
  ink: "#132A26", ink2: "#1E3F38", paper: "#F4EFE4", paperCard: "#FFFDF8",
  gold: "#B9862F", goldSoft: "#E6C888", line: "#DED2B3",
  good: "#3E7A5E", warn: "#C97A2B", bad: "#A63B34", muted: "#7A7161",
};
const PIE_COLORS = ["#B9862F", "#3E7A5E", "#1E3F38", "#C97A2B", "#7A9E8C", "#8C6D3F"];

/* ---------------- تخزين محلي (خاص بكل جهاز/متصفح) ---------------- */

function useStorage() {
  const [data, setDataState] = useState(null);
  const [status, setStatus] = useState("loading");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        setDataState(JSON.parse(raw));
      } else {
        const fresh = { sections: [DEFAULT_SECTION()] };
        setDataState(fresh);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      }
      setStatus("ready");
    } catch (e) {
      setStatus("error");
    }
  }, []);

  const persist = useCallback((next) => {
    setDataState(next);
    setSaving(true);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {}
    setTimeout(() => setSaving(false), 250);
  }, []);

  return { data, setData: persist, status, saving };
}

function sortRows(rows, key, dir) {
  const mult = dir === "desc" ? -1 : 1;
  return [...rows].sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * mult;
    return String(av ?? "").localeCompare(String(bv ?? ""), "ar") * mult;
  });
}

function SortableTh({ label, active, dir, onClick }) {
  return (
    <th style={{ ...thStyle, cursor: "pointer", userSelect: "none" }} onClick={onClick}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
        {label}
        <span style={{ fontSize: 10, color: active ? COLORS.gold : COLORS.line }}>{active ? (dir === "asc" ? "▲" : "▼") : "▲▼"}</span>
      </span>
    </th>
  );
}

function computeAttendancePct(section, studentSid) {
  const total = section.sessions.length;
  if (total === 0) return { pct: 0, absentCount: 0, total: 0 };
  let absent = 0;
  section.sessions.forEach((s) => {
    const st = section.attendance[`${s.id}:${studentSid}`];
    if (st === "غائب") absent += 1;
  });
  return { pct: Math.round((absent / total) * 1000) / 10, absentCount: absent, total };
}

function computeWeightedTotal(section, studentSid) {
  let earned = 0;
  let weightSum = 0;
  const breakdown = section.gradeItems.map((gi) => {
    const raw = section.grades[`${gi.id}:${studentSid}`];
    const score = typeof raw === "number" ? raw : 0;
    const ratio = gi.max > 0 ? score / gi.max : 0;
    const weighted = ratio * gi.weight;
    earned += weighted;
    weightSum += gi.weight;
    return { name: gi.name, score, max: gi.max, weight: gi.weight, weighted: Math.round(weighted * 100) / 100, has: raw !== undefined };
  });
  return { total: Math.round(earned * 100) / 100, weightSum, breakdown };
}

/* يقرأ ملف Excel (.xlsx/.xls) أو CSV ويستخرج أسماء الأعمدة وصفوف البيانات */
async function parseSpreadsheetFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  const headers = (rows[0] || []).map((h) => String(h ?? "").trim());
  const dataRows = rows.slice(1).filter((r) => Array.isArray(r) && r.some((c) => String(c ?? "").trim() !== ""));
  return { headers, rows: dataRows };
}

/* ---------------- أيقونات SVG بسيطة (بديل عن مكتبة خارجية) ---------------- */

function Icon({ name, size = 16, color = "currentColor", style, onClick, title }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style, onClick, role: onClick ? "button" : undefined };
  const P = (d) => <path d={d} />;
  switch (name) {
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14" /></svg>;
    case "trash": return <svg {...common}><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" /></svg>;
    case "users": return <svg {...common}><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2" /><circle cx="10" cy="7" r="4" /><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" /></svg>;
    case "calendar": return <svg {...common}><path d="M8 2v4M16 2v4M3 10h18" /><rect x="3" y="4" width="18" height="18" rx="2" /></svg>;
    case "award": return <svg {...common}><circle cx="12" cy="8" r="6" /><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12" /></svg>;
    case "note": return <svg {...common}><path d="M21 8V21a2 2 0 01-2 2H5a2 2 0 01-2-2V3a2 2 0 012-2h9l7 7z" /><path d="M16 3v6h6" /></svg>;
    case "chart": return <svg {...common}><path d="M18 20V10M12 20V4M6 20v-6" /></svg>;
    case "x": return <svg {...common}><path d="M18 6L6 18M6 6l12 12" /></svg>;
    case "check": return <svg {...common}><path d="M20 6L9 17l-5-5" /></svg>;
    case "pencil": return <svg {...common}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" /><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>;
    case "chevronRight": return <svg {...common}><path d="M9 18l6-6-6-6" /></svg>;
    case "alert": return <svg {...common}><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" /><path d="M12 9v4M12 17h.01" /></svg>;
    case "upload": return <svg {...common}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><path d="M17 8l-5-5-5 5M12 3v12" /></svg>;
    case "userPlus": return <svg {...common}><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /><circle cx="8.5" cy="7" r="4" /><path d="M20 8v6M23 11h-6" /></svg>;
    case "settings": return <svg {...common}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 007 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" /></svg>;
    case "clipboard": return <svg {...common}><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" /></svg>;
    case "download": return <svg {...common}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><path d="M7 10l5 5 5-5M12 15V3" /></svg>;
    default: return null;
  }
}

/* ---------------- رسوم بيانية مخصّصة بسيطة (بديل عن مكتبة خارجية) ---------------- */

function RadialGauge({ pct, color, size = 150 }) {
  const r = size / 2 - 12;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const offset = c - (clamped / 100) * c;
  return (
    <svg width="100%" viewBox={`0 0 ${size} ${size}`} style={{ display: "block" }}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EFE9D8" strokeWidth="14" />
      <circle
        cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
      />
    </svg>
  );
}

function SimpleBarChartH({ data, height = 190 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, height, justifyContent: "center" }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 90, fontSize: 11, color: COLORS.ink, textAlign: "left", flexShrink: 0 }}>{d.name}</div>
          <div style={{ flex: 1, background: "#EFE9D8", borderRadius: 6, overflow: "hidden", height: 16 }}>
            <div style={{ width: `${(d.value / max) * 100}%`, background: d.color || PIE_COLORS[i % PIE_COLORS.length], height: "100%", borderRadius: 6 }} />
          </div>
          <div style={{ width: 40, fontSize: 11, color: COLORS.muted, textAlign: "right" }}>{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function SimpleBarChartV({ data, height = 280 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height, overflowX: "auto", paddingBottom: 30, position: "relative" }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 32px" }}>
          <div style={{ fontSize: 10, color: COLORS.muted, marginBottom: 4 }}>{d.value}</div>
          <div style={{ width: 18, height: `${(d.value / max) * (height - 60)}px`, background: COLORS.gold, borderRadius: "6px 6px 0 0" }} />
          <div style={{
            fontSize: 9.5, color: COLORS.muted, marginTop: 6, transform: "rotate(-35deg)", transformOrigin: "top right",
            whiteSpace: "nowrap", maxWidth: 60, position: "absolute", bottom: -18, textAlign: "right",
          }}>{d.name}</div>
        </div>
      ))}
    </div>
  );
}

function SimplePieChart({ data, size = 200 }) {
  const total = data.reduce((a, d) => a + d.value, 0) || 1;
  let cumulative = 0;
  const r = size / 2;
  const cx = r, cy = r;
  const innerR = r * 0.55;
  const slices = data.map((d, i) => {
    const startAngle = (cumulative / total) * 2 * Math.PI;
    cumulative += d.value;
    const endAngle = (cumulative / total) * 2 * Math.PI;
    const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.sin(startAngle), y1 = cy - r * Math.cos(startAngle);
    const x2 = cx + r * Math.sin(endAngle), y2 = cy - r * Math.cos(endAngle);
    const ix1 = cx + innerR * Math.sin(startAngle), iy1 = cy - innerR * Math.cos(startAngle);
    const ix2 = cx + innerR * Math.sin(endAngle), iy2 = cy - innerR * Math.cos(endAngle);
    const path = `M ${ix1} ${iy1} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix1} ${iy1} Z`;
    return <path key={i} d={path} fill={d.color} />;
  });
  return (
    <svg width="100%" viewBox={`0 0 ${size} ${size}`}>
      {data.every((d) => d.value === 0) ? <circle cx={cx} cy={cy} r={r} fill="#EFE9D8" /> : slices}
    </svg>
  );
}

/* ---------------- UI atoms ---------------- */

function IconBtn({ onClick, title, children, tone = "default", small }) {
  const toneColor = tone === "danger" ? COLORS.bad : tone === "gold" ? COLORS.gold : COLORS.ink2;
  return (
    <button
      onClick={onClick} title={title}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: small ? 30 : 36, height: small ? 30 : 36, borderRadius: 10,
        border: `1px solid ${COLORS.line}`, background: COLORS.paperCard,
        color: toneColor, cursor: "pointer", transition: "all .15s",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.background = "#FBF6EA"; e.currentTarget.style.borderColor = toneColor; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = COLORS.paperCard; e.currentTarget.style.borderColor = COLORS.line; }}
    >
      {children}
    </button>
  );
}

function Badge({ children, tone = "muted" }) {
  const map = {
    good: { bg: "#E9F3EC", c: COLORS.good }, warn: { bg: "#FBEEDD", c: COLORS.warn },
    bad: { bg: "#F7E8E6", c: COLORS.bad }, muted: { bg: "#EFE9D8", c: COLORS.muted },
    gold: { bg: "#F4E7C9", c: "#8A6420" },
  };
  const s = map[tone];
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "3px 10px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, background: s.bg, color: s.c, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}

function TextInput(props) {
  return (
    <input {...props} style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: `1px solid ${COLORS.line}`, background: "#FFFFFF", fontSize: 14, color: COLORS.ink, outline: "none", fontFamily: "inherit", ...(props.style || {}) }} />
  );
}

function SectionCard({ children, style }) {
  return (
    <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: 20, boxShadow: "0 1px 2px rgba(19,42,38,0.04)", ...style }}>
      {children}
    </div>
  );
}

const thStyle = { textAlign: "right", padding: "10px 8px", fontSize: 12.5, color: COLORS.muted, fontWeight: 700 };
const tdStyle = { textAlign: "right", padding: "10px 8px", fontSize: 13.5, color: COLORS.ink, verticalAlign: "middle" };
const primaryBtnStyle = { display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", borderRadius: 9, border: "none", background: COLORS.gold, color: COLORS.ink, fontWeight: 800, fontSize: 13.5, cursor: "pointer" };
const ghostBtnStyle = { display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 9, border: `1px solid ${COLORS.goldSoft}`, background: "transparent", color: "#8A6420", fontWeight: 700, fontSize: 13, cursor: "pointer" };
const shellStyle = { minHeight: "100vh", background: `linear-gradient(180deg, ${COLORS.ink} 0%, ${COLORS.ink2} 220px, ${COLORS.paper} 220px)`, fontFamily: "'Segoe UI', Tahoma, 'Geeza Pro', system-ui, sans-serif" };

function statusColor(s) { return s === "حاضر" ? COLORS.good : s === "غائب" ? COLORS.bad : COLORS.warn; }
function statusBg(s) { return s === "حاضر" ? "#E9F3EC" : s === "غائب" ? "#F7E8E6" : "#FBEEDD"; }

/* ---------------- Import File Modal (اختيار الأعمدة) ---------------- */

function ImportFileModal({ fileName, headers, rows, onClose, onImportStudents }) {
  const [selected, setSelected] = useState(() => new Set(headers));
  const [idCol, setIdCol] = useState(() => headers.find((h) => h.includes("رقم") && h.includes("طالب")) || headers.find((h) => h.includes("جامعي")) || "");
  const [nameCol, setNameCol] = useState(() => headers.find((h) => h.includes("اسم")) || "");

  const toggle = (h) => {
    setSelected((prev) => { const next = new Set(prev); if (next.has(h)) next.delete(h); else next.add(h); return next; });
  };
  const selectAll = () => setSelected(new Set(headers));
  const selectNone = () => setSelected(new Set());

  const selectedList = headers.filter((h) => selected.has(h));
  const idIdx = headers.indexOf(idCol);
  const nameIdx = headers.indexOf(nameCol);
  const previewRows = rows.slice(0, 8);

  const handleImportStudents = () => {
    if (nameIdx === -1) return;
    const seen = new Set();
    const parsed = [];
    rows.forEach((r) => {
      const name = String(r[nameIdx] ?? "").trim();
      if (!name) return;
      const id = idIdx !== -1 ? String(r[idIdx] ?? "").trim() : "-";
      const key = `${id}|${name}`;
      if (seen.has(key)) return;
      seen.add(key);
      parsed.push({ sid: uid("stu"), id: id || "-", name });
    });
    onImportStudents(parsed);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 860, width: "100%", maxHeight: "90vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>استيراد بيانات من ملف</div>
            <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{fileName}</div>
          </div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>

        <div style={{ fontSize: 13, color: COLORS.muted, margin: "10px 0" }}>
          تم العثور على {headers.length} عمود و {rows.length} صف بيانات. اختر الأعمدة التي تريد عرضها في التطبيق:
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={selectAll} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>تحديد الكل</button>
          <button onClick={selectNone} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>إلغاء التحديد</button>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
          {headers.map((h, i) => (

/* ---------------- Students Tab ---------------- */

function StudentsTab({ section, updateSection, onOpenStudent }) {
  const [newId, setNewId] = useState("");
  const [newName, setNewName] = useState("");
  const [editingSid, setEditingSid] = useState(null);
  const [editVals, setEditVals] = useState({ id: "", name: "" });
  const [bulkText, setBulkText] = useState("");
  const [showBulk, setShowBulk] = useState(false);
  const fileInputRef = useRef(null);
  const [importData, setImportData] = useState(null);
  const [importError, setImportError] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  const addStudent = () => {
    if (!newName.trim()) return;
    updateSection((s) => ({ ...s, students: [...s.students, { sid: uid("stu"), id: newId.trim() || "-", name: newName.trim() }] }));
    setNewId(""); setNewName("");
  };

  const removeStudent = (sid) => updateSection((s) => ({ ...s, students: s.students.filter((st) => st.sid !== sid) }));

  const startEdit = (st) => { setEditingSid(st.sid); setEditVals({ id: st.id, name: st.name }); };
  const saveEdit = () => {
    updateSection((s) => ({ ...s, students: s.students.map((st) => st.sid === editingSid ? { ...st, id: editVals.id, name: editVals.name } : st) }));
    setEditingSid(null);
  };

  const importBulk = () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    const parsed = lines.map((line) => {
      const parts = line.split(/\t|,|\s{2,}/).map((p) => p.trim()).filter(Boolean);
      if (parts.length >= 2) return { sid: uid("stu"), id: parts[0], name: parts.slice(1).join(" ") };
      return { sid: uid("stu"), id: "-", name: line };
    });
    updateSection((s) => ({ ...s, students: [...s.students, ...parsed] }));
    setBulkText(""); setShowBulk(false);
  };

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError("");
    try {
      const { headers, rows } = await parseSpreadsheetFile(file);
      if (!headers.length) { setImportError("تعذّر العثور على أعمدة في الملف. تأكد أن الصف الأول يحتوي على أسماء الأعمدة."); return; }
      setImportData({ fileName: file.name, headers, rows });
    } catch (err) {
      setImportError("تعذّرت قراءة الملف. تأكد أنه بصيغة Excel (.xlsx/.xls) أو CSV صحيحة.");
    } finally {
      e.target.value = "";
    }
  };

  return (
    <SectionCard>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 16 }}>قائمة المتدربين ({section.students.length})</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleFileChange} />
          <button onClick={() => fileInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> استيراد من ملف Excel / CSV</button>
          <button onClick={() => setShowBulk((v) => !v)} style={ghostBtnStyle}><Icon name="userPlus" size={15} /> استيراد قائمة دفعة واحدة</button>
        </div>
      </div>

      {importError && <div style={{ marginBottom: 14, padding: "10px 14px", background: "#F7E8E6", color: COLORS.bad, borderRadius: 10, fontSize: 13 }}>{importError}</div>}

      {showBulk && (
        <div style={{ marginBottom: 16, padding: 14, background: "#F9F4E7", borderRadius: 12, border: `1px dashed ${COLORS.goldSoft}` }}>
          <div style={{ fontSize: 12.5, color: COLORS.muted, marginBottom: 8 }}>الصق كل طالب في سطر بصيغة: الرقم الجامعي ثم الاسم (مفصولة بمسافة أو Tab)</div>
          <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={5} placeholder={"446144915\tأسامه راشد عائض الشهراني\n446180489\tحمد بلغيث حسن الشهري"} style={{ width: "100%", padding: 10, borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13, resize: "vertical" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={importBulk} style={primaryBtnStyle}><Icon name="check" size={14} /> استيراد</button>
            <button onClick={() => setShowBulk(false)} style={ghostBtnStyle}>إلغاء</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ flex: "0 0 160px" }}><TextInput placeholder="الرقم الجامعي" value={newId} onChange={(e) => setNewId(e.target.value)} /></div>
        <div style={{ flex: "1 1 220px" }}><TextInput placeholder="اسم المتدرب" value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addStudent()} /></div>
        <button onClick={addStudent} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة</button>
      </div>

      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
              <th style={thStyle}>#</th>
              <SortableTh label="الرقم الجامعي" active={sortKey === "id"} dir={sortDir} onClick={() => toggleSort("id")} />
              <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
              <SortableTh label="نسبة الغياب" active={sortKey === "attPct"} dir={sortDir} onClick={() => toggleSort("attPct")} />
              <SortableTh label="الدرجة الموزونة" active={sortKey === "grdTotal"} dir={sortDir} onClick={() => toggleSort("grdTotal")} />
              <th style={thStyle}></th>
            </tr>
          </thead>
          <tbody>
            {(() => {
              const enriched = section.students.map((st) => {
                const att = computeAttendancePct(section, st.sid);
                const grd = computeWeightedTotal(section, st.sid);
                return { ...st, attPct: att.pct, attOver: att.pct >= section.absenceLimitPct, grdTotal: grd.total, grdWeightSum: grd.weightSum };
              });
              const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;
              return rows.map((st, idx) => {
              const over = st.attOver;
              const editing = editingSid === st.sid;
              return (
                <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <td style={tdStyle}>{idx + 1}</td>
                  <td style={tdStyle}>{editing ? <TextInput value={editVals.id} onChange={(e) => setEditVals((v) => ({ ...v, id: e.target.value }))} /> : st.id}</td>
                  <td style={{ ...tdStyle, fontWeight: 700, cursor: "pointer", color: COLORS.ink2 }} onClick={() => !editing && onOpenStudent(st.sid)}>
                    {editing ? <TextInput value={editVals.name} onChange={(e) => setEditVals((v) => ({ ...v, name: e.target.value }))} /> : st.name}
                  </td>
                  <td style={tdStyle}><Badge tone={over ? "bad" : "good"}>{st.attPct}% {over && <Icon name="alert" size={12} />}</Badge></td>
                  <td style={tdStyle}><Badge tone="gold">{st.grdTotal} / {st.grdWeightSum}</Badge></td>
                  <td style={{ ...tdStyle, whiteSpace: "nowrap" }}>
                    <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                      {editing ? <IconBtn onClick={saveEdit} title="حفظ" small><Icon name="check" size={15} /></IconBtn> : <IconBtn onClick={() => startEdit(st)} title="تعديل" small><Icon name="pencil" size={14} /></IconBtn>}
                      <IconBtn onClick={() => removeStudent(st.sid)} title="حذف" tone="danger" small><Icon name="trash" size={14} /></IconBtn>
                    </div>
                  </td>
                </tr>
              );
              });
            })()}
            {section.students.length === 0 && <tr><td colSpan={6} style={{ ...tdStyle, textAlign: "center", color: COLORS.muted, padding: 24 }}>لا يوجد متدربون بعد</td></tr>}
          </tbody>
        </table>
      </div>

      {importData && (
        <ImportFileModal
          fileName={importData.fileName} headers={importData.headers} rows={importData.rows}
          onClose={() => setImportData(null)}
          onImportStudents={(parsed) => { updateSection((s) => ({ ...s, students: [...s.students, ...parsed] })); setImportData(null); }}
        />
      )}
    </SectionCard>
  );
}

function ContactsTab({ section, updateSection }) {
  const fileInputRef = useRef(null);
  const [importData, setImportData] = useState(null);
  const [importError, setImportError] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  const setField = (sid, field, value) => updateSection((s) => ({ ...s, students: s.students.map((st) => st.sid === sid ? { ...st, [field]: value } : st) }));

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportError("");
    try {
      const { headers, rows } = await parseSpreadsheetFile(file);
      if (!headers.length) { setImportError("تعذّر العثور على أعمدة في الملف."); return; }
      setImportData({ fileName: file.name, headers, rows });
    } catch (err) {
      setImportError("تعذّرت قراءة الملف. تأكد أنه بصيغة Excel أو CSV صحيحة.");
    } finally {
      e.target.value = "";
    }
  };

  const applyContactImport = (updates) => {
    updateSection((s) => {
      let students = [...s.students];
      updates.forEach((u) => {
        let idx = -1;
        if (u.id) idx = students.findIndex((st) => st.id === u.id);
        if (idx === -1 && u.name) idx = students.findIndex((st) => st.name.trim() === u.name.trim());
        if (idx !== -1) {
          students[idx] = { ...students[idx], email: u.email || students[idx].email || "", phone: u.phone || students[idx].phone || "" };
        } else if (u.name) {
          students.push({ sid: uid("stu"), id: u.id || "-", name: u.name, email: u.email || "", phone: u.phone || "" });
        }
      });
      return { ...s, students };
    });
    setImportData(null);
  };

  const enriched = section.students.map((st) => ({ ...st, email: st.email || "", phone: st.phone || "" }));
  const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;

  return (
    <SectionCard>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 16 }}>قائمة التواصل ({section.students.length})</div>
        <div>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleFileChange} />
          <button onClick={() => fileInputRef.current?.click()} style={ghostBtnStyle}><Icon name="upload" size={15} /> استيراد من ملف Excel / CSV</button>
        </div>
      </div>

      {importError && <div style={{ marginBottom: 14, padding: "10px 14px", background: "#F7E8E6", color: COLORS.bad, borderRadius: 10, fontSize: 13 }}>{importError}</div>}

      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
              <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
              <SortableTh label="الرقم الجامعي" active={sortKey === "id"} dir={sortDir} onClick={() => toggleSort("id")} />
              <SortableTh label="البريد الإلكتروني" active={sortKey === "email"} dir={sortDir} onClick={() => toggleSort("email")} />
              <SortableTh label="الجوال" active={sortKey === "phone"} dir={sortDir} onClick={() => toggleSort("phone")} />
            </tr>
          </thead>
          <tbody>
            {rows.map((st) => (
              <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                <td style={{ ...tdStyle, fontWeight: 700 }}>{st.name}</td>
                <td style={tdStyle}>{st.id}</td>
                <td style={tdStyle}><TextInput type="email" placeholder="example@mail.com" value={st.email} onChange={(e) => setField(st.sid, "email", e.target.value)} style={{ minWidth: 180 }} /></td>
                <td style={tdStyle}><TextInput type="tel" placeholder="05xxxxxxxx" value={st.phone} onChange={(e) => setField(st.sid, "phone", e.target.value)} style={{ minWidth: 140 }} /></td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={4} style={{ ...tdStyle, textAlign: "center", color: COLORS.muted, padding: 24 }}>لا يوجد متدربون بعد</td></tr>}
          </tbody>
        </table>
      </div>

      {importData && (
        <ContactImportModal
          fileName={importData.fileName} headers={importData.headers} rows={importData.rows} students={section.students}
          onClose={() => setImportData(null)} onApply={applyContactImport}
        />
      )}
    </SectionCard>
  );
}

/* ---------------- Attendance Tab ---------------- */

function AttendanceTab({ section, updateSection }) {
  const [newLabel, setNewLabel] = useState("");
  const [newDate, setNewDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [activeSessionId, setActiveSessionId] = useState(section.sessions[section.sessions.length - 1]?.id || null);

  useEffect(() => {
    if (!activeSessionId && section.sessions.length) setActiveSessionId(section.sessions[section.sessions.length - 1].id);
  }, [section.sessions, activeSessionId]);

  const addSession = () => {
    const label = newLabel.trim() || `جلسة ${section.sessions.length + 1}`;
    const s = { id: uid("ses"), label, date: newDate };
    updateSection((sec) => ({ ...sec, sessions: [...sec.sessions, s] }));
    setActiveSessionId(s.id);
    setNewLabel("");
  };

  const removeSession = (id) => {
    updateSection((sec) => ({ ...sec, sessions: sec.sessions.filter((x) => x.id !== id) }));
    if (activeSessionId === id) setActiveSessionId(null);
  };

  const setStatus = (studentSid, status) => {
    updateSection((sec) => ({ ...sec, attendance: { ...sec.attendance, [`${activeSessionId}:${studentSid}`]: status } }));
  };

  const session = section.sessions.find((s) => s.id === activeSessionId);

  return (
    <div className="rg-attendance">
      <SectionCard style={{ padding: 14, alignSelf: "start" }}>
        <div style={{ fontWeight: 800, marginBottom: 10, color: COLORS.ink }}>الجلسات</div>
        <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>

/* ---------------- Grades Tab ---------------- */

function GradesTab({ section, updateSection }) {
  const [newItem, setNewItem] = useState({ name: "", weight: "", max: "" });
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };
  const weightTotal = section.gradeItems.reduce((a, g) => a + g.weight, 0);

  const addItem = () => {
    if (!newItem.name.trim() || !newItem.weight || !newItem.max) return;
    updateSection((s) => ({ ...s, gradeItems: [...s.gradeItems, { id: uid("gi"), name: newItem.name.trim(), weight: Number(newItem.weight), max: Number(newItem.max) }] }));
    setNewItem({ name: "", weight: "", max: "" });
  };

  const removeItem = (id) => updateSection((s) => ({ ...s, gradeItems: s.gradeItems.filter((g) => g.id !== id) }));

  const setScore = (itemId, studentSid, value) => {
    const num = value === "" ? undefined : Number(value);
    updateSection((s) => ({ ...s, grades: { ...s.grades, [`${itemId}:${studentSid}`]: num } }));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <SectionCard>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 15 }}>بنود التقييم</div>
          <Badge tone={weightTotal === 100 ? "good" : "warn"}>مجموع الأوزان: {weightTotal}%</Badge>
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
          {section.gradeItems.map((gi) => (
            <div key={gi.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: "#F9F4E7", borderRadius: 10, border: `1px solid ${COLORS.goldSoft}` }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink }}>{gi.name}</div>
                <div style={{ fontSize: 11, color: COLORS.muted }}>وزن {gi.weight}% · من {gi.max}</div>
              </div>
              <Icon name="trash" size={13} color={COLORS.bad} style={{ cursor: "pointer" }} onClick={() => removeItem(gi.id)} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 180px" }}><TextInput placeholder="اسم البند (مثال: اختبار قصير)" value={newItem.name} onChange={(e) => setNewItem((v) => ({ ...v, name: e.target.value }))} /></div>
          <div style={{ width: 110 }}><TextInput placeholder="الوزن %" type="number" value={newItem.weight} onChange={(e) => setNewItem((v) => ({ ...v, weight: e.target.value }))} /></div>
          <div style={{ width: 110 }}><TextInput placeholder="الدرجة القصوى" type="number" value={newItem.max} onChange={(e) => setNewItem((v) => ({ ...v, max: e.target.value }))} /></div>
          <button onClick={addItem} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة بند</button>
        </div>
      </SectionCard>

      <SectionCard>
        <div style={{ fontWeight: 800, color: COLORS.ink, fontSize: 15, marginBottom: 12 }}>سجل الدرجات</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
                <SortableTh label="الاسم" active={sortKey === "name"} dir={sortDir} onClick={() => toggleSort("name")} />
                {section.gradeItems.map((gi) => (
                  <SortableTh key={gi.id} label={`${gi.name} (من ${gi.max})`} active={sortKey === gi.id} dir={sortDir} onClick={() => toggleSort(gi.id)} />
                ))}
                <SortableTh label="الإجمالي الموزون" active={sortKey === "grdTotal"} dir={sortDir} onClick={() => toggleSort("grdTotal")} />
              </tr>
            </thead>
            <tbody>
              {(() => {
                const enriched = section.students.map((st) => {
                  const grd = computeWeightedTotal(section, st.sid);
                  const row = { ...st, grdTotal: grd.total };
                  section.gradeItems.forEach((gi) => { row[gi.id] = section.grades[`${gi.id}:${st.sid}`] ?? -1; });
                  return row;
                });
                const rows = sortKey ? sortRows(enriched, sortKey, sortDir) : enriched;
                return rows.map((st) => {
                const grd = computeWeightedTotal(section, st.sid);
                return (
                  <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                    <td style={{ ...tdStyle, fontWeight: 700 }}>{st.name}</td>
                    {section.gradeItems.map((gi) => (
                      <td key={gi.id} style={tdStyle}>
                        <input type="number" min={0} max={gi.max} value={section.grades[`${gi.id}:${st.sid}`] ?? ""} onChange={(e) => setScore(gi.id, st.sid, e.target.value)} style={{ width: 66, padding: "6px 8px", borderRadius: 7, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />
                      </td>
                    ))}
                    <td style={tdStyle}><Badge tone="gold">{grd.total}</Badge></td>
                  </tr>
                );
                });
              })()}
            </tbody>
          </table>
        </div>
      </SectionCard>
    </div>
  );
}

/* ---------------- Reports Tab ---------------- */

function ReportsTab({ section, onOpenStudent }) {
  const rows = section.students.map((st) => {

            <SimplePieChart data={pieData} size={200} />
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 16, fontSize: 12.5, marginTop: 10 }}>
            <span style={{ color: COLORS.good }}>● منتظمون {okCount}</span>
            <span style={{ color: COLORS.bad }}>● متجاوزون {overCount}</span>
          </div>
        </SectionCard>
      </div>

      <SectionCard>
        <div style={{ fontWeight: 800, color: COLORS.ink, marginBottom: 10 }}>تفصيل شامل</div>

          <table>
            <thead>
              <tr style={{ borderBottom: `2px solid ${COLORS.line}` }}>
                <th style={thStyle}>الاسم</th><th style={thStyle}>نسبة الغياب</th><th style={thStyle}>الدرجة الموزونة</th><th style={thStyle}>ملاحظات</th><th style={thStyle}></th>

              {rows.map(({ st, att, grd }) => (
                <tr key={st.sid} style={{ borderBottom: `1px solid ${COLORS.line}` }}>

                  <td style={tdStyle}>{section.notes.filter((n) => n.studentSid === st.sid).length}</td>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </SectionCard>
    </div>
  );
}

/* ---------------- Student Detail Modal ---------------- */

function StudentDetailModal({ section, studentSid, onClose }) {

  const grd = computeWeightedTotal(section, studentSid);
  const notes = section.notes.filter((n) => n.studentSid === studentSid);
  const gaugeColor = att.pct >= section.absenceLimitPct ? COLORS.bad : COLORS.good;
  const breakdownData = grd.breakdown.map((b) => ({ name: b.name, value: b.weighted }));

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>

            <div style={{ maxWidth: 160, margin: "0 auto", position: "relative" }}>
              <RadialGauge pct={att.pct} color={gaugeColor} size={150} />

        <SectionCard style={{ padding: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink, marginBottom: 8 }}>ملاحظات ({notes.length})</div>

/* ---------------- Section Manager Modal ---------------- */

function SectionManagerModal({ data, setData, activeSectionId, setActiveSectionId, onClose }) {
  const [newName, setNewName] = useState("");

  const addSection = () => {
    if (!newName.trim()) return;
    const sec = { ...DEFAULT_SECTION(), name: newName.trim(), students: [] };
    setData({ ...data, sections: [...data.sections, sec] });
    setActiveSectionId(sec.id);
    setNewName("");
  };

  const removeSection = (id) => {
    if (data.sections.length <= 1) return;
    const next = data.sections.filter((s) => s.id !== id);
    setData({ ...data, sections: next });
    if (activeSectionId === id) setActiveSectionId(next[0]?.id || null);
  };

  const renameSection = (id, name) => setData({ ...data, sections: data.sections.map((s) => s.id === id ? { ...s, name } : s) });
  const setLimit = (id, val) => setData({ ...data, sections: data.sections.map((s) => s.id === id ? { ...s, absenceLimitPct: Number(val) } : s) });

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 560, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>إدارة الشعب</div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          {data.sections.map((s) => (
            <SectionCard key={s.id} style={{ padding: 12 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                <TextInput value={s.name} onChange={(e) => renameSection(s.id, e.target.value)} />
                <IconBtn onClick={() => removeSection(s.id)} title="حذف الشعبة" tone="danger" small><Icon name="trash" size={14} /></IconBtn>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: COLORS.muted }}>
                حد نسبة الغياب المسموح:
                <input type="number" value={s.absenceLimitPct} onChange={(e) => setLimit(s.id, e.target.value)} style={{ width: 60, padding: "5px 8px", borderRadius: 7, border: `1px solid ${COLORS.line}`, textAlign: "center" }} />%
                <span style={{ marginRight: "auto" }}>{s.students.length} متدرب</span>
              </div>
            </SectionCard>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8 }}>
          <TextInput placeholder="اسم الشعبة الجديدة" value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addSection()} />
          <button onClick={addSection} style={primaryBtnStyle}><Icon name="plus" size={15} /> إضافة شعبة</button>
        </div>
      </div>
    </div>
  );
}

          <Note>جميع بياناتك تُحفظ محليًا داخل متصفح جهازك فقط (localStorage) ولا تُرسل لأي خادم. راجع قسم «النسخ الاحتياطي» أدناه بعناية.</Note>

        <Sec title="٣. تبويب «المتدربون»">

            "ادخل رايات ثم متابعة الحضور ثم اختر الشعبة ثم اضغط الترس الموجود في أعلى اليسار واختر تصدير واحفظ الملف في مكان واضح دون أن تغير صيغته.",

            "حدّد الأعمدة التي تريد عرضها في المعاينة (اختياري).",

        <Sec title="٤. تبويب «الحضور»">

        <Sec title="٥. تبويب «الدرجات»">

        <Sec title="٦. تبويب «الملاحظات»">

        <Sec title="٨. بطاقة تفاصيل المتدرب">

        <Sec title="٩. إدارة عدّة شعب">

            "بيانات كل شعبة منفصلة تمامًا عن الأخرى.",
            "لا يمكن حذف آخر شعبة متبقية.",
          ]} />

        <Sec title="١٠. النسخ الاحتياطي (مهم جدًا)">
          <p>بما أن البيانات محفوظة في متصفح جهازك فقط، قد تُفقد عند مسح بيانات التصفح، تغيير الجهاز، أو تعطّله.</p>

            "«تصدير نسخة احتياطية»: يُنزّل كل بيانات كل الشعب كملف JSON — احتفظ به في مكان آمن.",

        </Sec>

        <Sec title="١١. الخصوصية ومشاركة التطبيق">
          <p>يمكنك مشاركة ملف التطبيق مع أي زميل ليستخدمه بشكل مستقل تمامًا — بيانات كل شخص محفوظة في متصفحه فقط ولا تظهر لغيره حتى لو استخدم الجميع نفس نسخة الملف.</p>
        </Sec>

        <Sec title="١٢. استكشاف الأخطاء">
          <Sub title="شاشة بيضاء عند الفتح" />
          <Ul items={[
            "تأكد من اتصالك بالإنترنت عند أول تشغيل.",
            "جرّب متصفحًا آخر (يُفضَّل Chrome محدَّث).",

          ]} />
          <Sub title="فقدان بيانات شعبة" />
          <Ul items={["تحقق أولًا من القائمة المنسدلة أعلى الصفحة.", "استرجع آخر نسخة احتياطية محفوظة لديك."]} />
        </Sec>

        <Sec title="١٣. أسئلة شائعة">
          <p><b>هل يحتاج التطبيق اتصالًا دائمًا بالإنترنت؟</b><br />لا، فقط عند أول تشغيل.</p>
          <p><b>هل يمكن الوصول لبياناتي من جهاز آخر؟</b><br />لا تلقائيًا، انقلها عبر تصدير/استيراد نسخة احتياطية.</p>
          <p><b>هل بياناتي مرئية لأي طرف آخر؟</b><br />لا، تبقى محصورة داخل متصفحك فقط.</p>
        </Sec>

        <div style={{ textAlign: "center", fontSize: 12, color: COLORS.muted, marginTop: 10, borderTop: `1px solid ${COLORS.line}`, paddingTop: 12 }}>
          إعداد: كليب بن أحمد بن ضيف الله الزهراني
        </div>
      </div>
    </div>
  );
}

function StatCard({ iconName, label, value, tone }) {
  const color = tone === "bad" ? COLORS.bad : tone === "good" ? COLORS.good : COLORS.ink;
  return (
    <div className="stat-card" style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: "14px 18px", minWidth: 175, flex: "1 1 175px", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 6px 16px rgba(19,42,38,0.08)" }}>
      <div style={{ width: 38, height: 38, borderRadius: 10, background: "#F4E7C9", display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.gold, flexShrink: 0 }}>
        <Icon name={iconName} size={18} />
      </div>
      <div>
        <div style={{ fontSize: 21, fontWeight: 800, color }}>{value}</div>
        <div style={{ fontSize: 12, color: COLORS.muted }}>{label}</div>
      </div>
    </div>
  );
}

function SectionHeader({ section }) {
  const total = section.students.length;
  const overLimit = section.students.filter((st) => computeAttendancePct(section, st.sid).pct >= section.absenceLimitPct).length;
  const avgTotal = total ? Math.round((section.students.reduce((acc, st) => acc + computeWeightedTotal(section, st.sid).total, 0) / total) * 10) / 10 : 0;
  return (
    <div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <StatCard iconName="users" label="عدد المتدربين" value={total} />
        <StatCard iconName="calendar" label="عدد الجلسات المسجّلة" value={section.sessions.length} />
        <StatCard iconName="alert" label={`تجاوزوا حد الغياب (${section.absenceLimitPct}%)`} value={overLimit} tone={overLimit > 0 ? "bad" : "good"} />
        <StatCard iconName="award" label="متوسط الدرجة الموزونة" value={avgTotal} />
      </div>
    </div>
  );
}

}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildExportHTML(section, sel) {
  const styles = "body{font-family:Arial,Tahoma,sans-serif;direction:rtl;text-align:right;color:#132A26;} h1{font-size:22px;margin-bottom:4px;} h2{font-size:16px;margin-top:26px;border-bottom:2px solid #DED2B3;padding-bottom:4px;} table{border-collapse:collapse;width:100%;margin-top:8px;} th,td{border:1px solid #DED2B3;padding:6px 8px;font-size:12px;text-align:right;} th{background:#F4E7C9;} p{font-size:12.5px;color:#7A7161;}";
  let body = `<h1>${esc(section.name || "شعبة بدون اسم")}</h1><p>تاريخ التصدير: ${new Date().toLocaleDateString("ar")}</p>`;

  if (sel.students) {
    body += "<h2>المتدربون</h2><table><tr><th>#</th><th>الرقم الجامعي</th><th>الاسم</th><th>نسبة الغياب</th><th>الدرجة الموزونة</th></tr>";
    section.students.forEach((st, i) => {
      const att = computeAttendancePct(section, st.sid);
      const grd = computeWeightedTotal(section, st.sid);
      body += `<tr><td>${i + 1}</td><td>${esc(st.id)}</td><td>${esc(st.name)}</td><td>${att.pct}%</td><td>${grd.total}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.attendance) {
    body += "<h2>الحضور</h2>";
    if (section.sessions.length === 0) body += "<p>لا توجد جلسات مسجّلة.</p>";
    else {
      body += "<table><tr><th>الاسم</th>" + section.sessions.map((s) => `<th>${esc(s.label)}<br/>${esc(s.date)}</th>`).join("") + "</tr>";
      section.students.forEach((st) => {
        body += `<tr><td>${esc(st.name)}</td>` + section.sessions.map((s) => `<td>${esc(section.attendance[`${s.id}:${st.sid}`] || "-")}</td>`).join("") + "</tr>";
      });
      body += "</table>";
    }
  }

  if (sel.grades) {
    body += "<h2>الدرجات</h2><table><tr><th>الاسم</th>" + section.gradeItems.map((gi) => `<th>${esc(gi.name)} (${gi.weight}%)</th>`).join("") + "<th>الإجمالي الموزون</th></tr>";
    section.students.forEach((st) => {
      const grd = computeWeightedTotal(section, st.sid);
      body += `<tr><td>${esc(st.name)}</td>` + section.gradeItems.map((gi) => `<td>${section.grades[`${gi.id}:${st.sid}`] ?? ""}</td>`).join("") + `<td>${grd.total}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.notes) {
    body += "<h2>الملاحظات</h2>";
    if (section.notes.length === 0) body += "<p>لا توجد ملاحظات.</p>";
    else {
      body += "<table><tr><th>الاسم</th><th>التاريخ</th><th>الملاحظة</th></tr>";
      section.notes.forEach((n) => {
        const st = section.students.find((s) => s.sid === n.studentSid);
        body += `<tr><td>${esc(st ? st.name : "—")}</td><td>${esc(n.date)}</td><td>${esc(n.text)}</td></tr>`;
      });
      body += "</table>";
    }
  }

  if (sel.contacts) {
    body += "<h2>التواصل</h2><table><tr><th>الاسم</th><th>الرقم الجامعي</th><th>البريد الإلكتروني</th><th>الجوال</th></tr>";
    section.students.forEach((st) => {
      body += `<tr><td>${esc(st.name)}</td><td>${esc(st.id)}</td><td>${esc(st.email || "-")}</td><td>${esc(st.phone || "-")}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.reports) {
    body += "<h2>تقرير ملخص</h2><table><tr><th>الاسم</th><th>نسبة الغياب</th><th>الدرجة الموزونة</th><th>عدد الملاحظات</th></tr>";
    section.students.forEach((st) => {
      const att = computeAttendancePct(section, st.sid);
      const grd = computeWeightedTotal(section, st.sid);
      const notesCount = section.notes.filter((n) => n.studentSid === st.sid).length;
      body += `<tr><td>${esc(st.name)}</td><td>${att.pct}%</td><td>${grd.total}</td><td>${notesCount}</td></tr>`;
    });
    body += "</table>";
  }

  return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>${styles}</style></head><body>${body}</body></html>`;
}

function ExportModal({ section, onClose }) {
  const [sel, setSel] = useState({ students: true, attendance: true, grades: true, notes: true, contacts: true, reports: true });
  const [busy, setBusy] = useState(false);
  const toggle = (k) => setSel((v) => ({ ...v, [k]: !v[k] }));
  const setAll = (val) => setSel({ students: val, attendance: val, grades: val, notes: val, contacts: val, reports: val });
  const anySelected = Object.values(sel).some(Boolean);
  const fileBase = (section.name || "تقرير_الشعبة").replace(/[\\/:*?"<>|]/g, "-");

  const items = [
    { key: "students", label: "المتدربون" },
    { key: "attendance", label: "الحضور" },
    { key: "grades", label: "الدرجات" },
    { key: "notes", label: "الملاحظات" },
    { key: "contacts", label: "التواصل" },
    { key: "reports", label: "التقارير" },
  ];

  const doExportWord = () => {
    if (!window.htmlDocx) { alert("تعذّر تحميل مكتبة تصدير Word، تحقق من اتصالك بالإنترنت وحاول مجددًا."); return; }
    const html = buildExportHTML(section, sel);
    const blob = window.htmlDocx.asBlob(html);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${fileBase}.doc`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const doExportPDF = async () => {
    if (!window.jspdf || !window.html2canvas) { alert("تعذّر تحميل مكتبة تصدير PDF، تحقق من اتصالك بالإنترنت وحاول مجددًا."); return; }
    setBusy(true);
    const html = buildExportHTML(section, sel);
    const container = document.createElement("div");
    container.style.position = "fixed"; container.style.left = "-9999px"; container.style.top = "0";
    container.style.width = "800px"; container.style.background = "#fff";
    container.innerHTML = html;
    document.body.appendChild(container);
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "pt", format: "a4" });
      await pdf.html(container, {
        x: 20, y: 20, width: 555, windowWidth: 800,
        callback: (doc) => { doc.save(`${fileBase}.pdf`); container.remove(); setBusy(false); },
      });
    } catch (e) {
      container.remove(); setBusy(false);
      alert("حدث خطأ أثناء إنشاء ملف PDF.");
    }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 520, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>تصدير تقرير</div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>
        <div style={{ fontSize: 12.5, color: COLORS.muted, margin: "8px 0 14px" }}>اختر الأقسام التي تريد تضمينها في الملف المُصدَّر:</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={() => setAll(true)} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>تحديد الكل</button>
          <button onClick={() => setAll(false)} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>إلغاء التحديد</button>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
          {items.map((it) => (
            <label key={it.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderRadius: 9, border: `1px solid ${sel[it.key] ? COLORS.gold : COLORS.line}`, background: sel[it.key] ? "#F4E7C9" : COLORS.paperCard, cursor: "pointer" }}>
              <input type="checkbox" checked={sel[it.key]} onChange={() => toggle(it.key)} style={{ accentColor: COLORS.gold }} />
              <span style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.ink }}>{it.label}</span>
            </label>
          ))}
        </div>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button onClick={doExportWord} disabled={!anySelected} style={{ ...primaryBtnStyle, opacity: anySelected ? 1 : 0.5 }}>
            <Icon name="download" size={15} /> تصدير Word
          </button>
          <button onClick={doExportPDF} disabled={!anySelected || busy} style={{ ...ghostBtnStyle, opacity: (anySelected && !busy) ? 1 : 0.5 }}>
            <Icon name="download" size={15} /> {busy ? "جارِ التصدير..." : "تصدير PDF"}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const { data, setData, status, saving } = useStorage();
  const [activeSectionId, setActiveSectionId] = useState(null);
  const [tab, setTab] = useState("students");
  const [studentDetail, setStudentDetail] = useState(null);
  const [showSectionMgr, setShowSectionMgr] = useState(false);
  const [showGuide, setShowGuide] = useState(false);
  const [showExport, setShowExport] = useState(false);

  useEffect(() => {
    if (data && !activeSectionId && data.sections.length) setActiveSectionId(data.sections[0].id);
  }, [data, activeSectionId]);

  const section = useMemo(() => data?.sections.find((s) => s.id === activeSectionId) || null, [data, activeSectionId]);

  const updateSection = useCallback((patchFn) => {
    if (!data || !section) return;
    const nextSections = data.sections.map((s) => (s.id === section.id ? patchFn(s) : s));
    setData({ ...data, sections: nextSections });
  }, [data, section, setData]);

  const importInputRef = useRef(null);

  const exportBackup = () => {
    if (!data) return;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `نسخة-احتياطية-دفتر-المتابعة-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importBackup = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.sections)) throw new Error("bad format");
      setData(parsed);
      setActiveSectionId(parsed.sections[0]?.id || null);
    } catch (err) {
      alert("تعذّر استيراد الملف. تأكد أنه ملف نسخة احتياطية صحيح تم تصديره من هذا التطبيق.");
    } finally {
      e.target.value = "";
    }
  };

  if (status === "loading" || !data) {
    return <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}><div style={{ color: COLORS.paper, fontSize: 15 }}>...جارِ فتح دفتر المتابعة</div></div>;
  }
  if (status === "error") {
    return <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}><div style={{ color: "#F7E8E6" }}>تعذّر تحميل البيانات. حاول تحديث الصفحة.</div></div>;
  }

  return (
    <div dir="rtl" style={shellStyle}>
      <TopBar
        saving={saving} section={section} sections={data.sections} onSwitch={setActiveSectionId}
        onManage={() => setShowSectionMgr(true)} onExport={exportBackup}
        onImportClick={() => importInputRef.current?.click()}
        onOpenGuide={() => setShowGuide(true)}
        onOpenReportExport={() => setShowExport(true)}
      />
      <input ref={importInputRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importBackup} />
      <BackupBanner onExport={exportBackup} />
      {section && (
        <div className="app-container" style={{ maxWidth: 1180, margin: "0 auto", padding: "22px 22px 60px" }}>
          <SectionHeader section={section} />
          <Tabs tab={tab} setTab={setTab} />
          {tab === "students" && <StudentsTab section={section} updateSection={updateSection} onOpenStudent={setStudentDetail} />}
          {tab === "attendance" && <AttendanceTab section={section} updateSection={updateSection} />}
          {tab === "grades" && <GradesTab section={section} updateSection={updateSection} />}
          {tab === "notes" && <NotesTab section={section} updateSection={updateSection} />}
          {tab === "contacts" && <ContactsTab section={section} updateSection={updateSection} />}
          {tab === "reports" && <ReportsTab section={section} onOpenStudent={setStudentDetail} />}
        </div>
      )}
      {studentDetail && section && <StudentDetailModal section={section} studentSid={studentDetail} onClose={() => setStudentDetail(null)} />}
      {showSectionMgr && (
        <SectionManagerModal data={data} setData={setData} activeSectionId={activeSectionId} setActiveSectionId={setActiveSectionId} onClose={() => setShowSectionMgr(false)} />
      )}
      {showGuide && <GuideModal onClose={() => setShowGuide(false)} />}
      {showExport && section && <ExportModal section={section} onClose={() => setShowExport(false)} />}
      <div style={{ textAlign: "center", padding: "18px 10px 26px", fontSize: 12.5, color: COLORS.muted }}>
        إعداد: كليب بن أحمد بن ضيف الله الزهراني
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
<script>
  // نحوّل كود JSX يدويًا باستخدام "classic runtime" حتى لا يولّد Babel
  // عبارات import (react/jsx-runtime) التي تفشل في المتصفح كملف عادي (غير module)
  (function () {
    try {
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.text = out;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;font-family:sans-serif;direction:rtl;color:#A63B34;">' +
        "حدث خطأ أثناء تشغيل التطبيق: " + (e && e.message ? e.message : e) + "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
