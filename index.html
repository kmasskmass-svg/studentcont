                const updateSection = useCallback((patchFn) => {
                    if (!data || !section) return;
                    const nextSections = data.sections.map((s) => (s.id === section.id ? patchFn(s) : s));
                    setData({ ...data, sections: nextSections });
                }, [data, section, setData]);

                if (status === "loading" || !data) {
                    return (
                        <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}>
                            <div style={{ color: COLORS.paper, fontFamily: "inherit", fontSize: 15 }}>...جارِ فتح دفتر المتابعة</div>
                        </div>
                    );
                }

                if (status === "error") {
                    return (
                        <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}>
                            <div style={{ color: "#F7E8E6", fontFamily: "inherit" }}>تعذّر تحميل البيانات. حاول تحديث الصفحة.</div>
                        </div>
                    );
                }

                return (
                    <div dir="rtl" style={shellStyle}>
                        <TopBar
                            saving={saving}
                            section={section}
                            sections={data.sections}
                            onSwitch={setActiveSectionId}
                            onManage={() => setShowSectionMgr(true)}
                        />

                        {section && (
                            <div style={{ maxWidth: 1180, margin: "0 auto", padding: "22px 22px 60px" }}>
                                <SectionHeader section={section} />
                                <Tabs tab={tab} setTab={setTab} />

                                {tab === "students" && (
                                    <StudentsTab section={section} updateSection={updateSection} onOpenStudent={setStudentDetail} />
                                )}
                                {tab === "attendance" && (
                                    <AttendanceTab section={section} updateSection={updateSection} />
                                )}
                                {tab === "grades" && (
                                    <GradesTab section={section} updateSection={updateSection} />
                                )}
                                {tab === "notes" && (
                                    <NotesTab section={section} updateSection={updateSection} />
                                )}
                                {tab === "reports" && (
                                    <ReportsTab section={section} onOpenStudent={setStudentDetail} />
                                )}
                            </div>
                        )}

                        {studentDetail && section && (
                            <StudentDetailModal section={section} studentSid={studentDetail} onClose={() => setStudentDetail(null)} />
                        )}

                        {showSectionMgr && (
                            <SectionManagerModal
                                data={data}
                                setData={setData}
                                activeSectionId={activeSectionId}
                                setActiveSectionId={setActiveSectionId}
                                onClose={() => setShowSectionMgr(false)}
                            />
                        )}
                    </div>
                );
            }

            const shellStyle = {
                minHeight: "100vh",
                background: `linear-gradient(180deg, ${COLORS.ink} 0%, ${COLORS.ink2} 220px, ${COLORS.paper} 220px)`,
                fontFamily: "'Segoe UI', Tahoma, 'Geeza Pro', system-ui, sans-serif",
            };

            ReactDOM.render(<App />, document.getElementById('root'));
        };
    </script>
</body>
</html>
