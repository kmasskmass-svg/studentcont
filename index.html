function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildExportHTML(section, sel) {
  const styles = "body{font-family:Arial,Tahoma,sans-serif;direction:rtl;text-align:right;color:#132A26;} h1{font-size:22px;margin-bottom:4px;} h2{font-size:16px;margin-top:26px;border-bottom:2px solid #DED2B3;padding-bottom:4px;} table{border-collapse:collapse;width:100%;margin-top:8px;} th,td{border:1px solid #DED2B3;padding:6px 8px;font-size:12px;text-align:right;} th{background:#F4E7C9;} p{font-size:12.5px;color:#7A7161;}";
  let body = `<h1>${esc(section.name || "شعبة بدون اسم")}</h1><p>تاريخ التصدير: ${new Date().toLocaleDateString("ar")}</p>`;

  if (sel.students) {
    body += "<h2>المتدربون</h2><table><tr><th>#</th><th>الرقم الأكاديمي</th><th>الاسم</th><th>نسبة الغياب</th><th>الدرجة الموزونة</th></tr>";
    section.students.forEach((st, i) => {
      const att = computeAttendancePct(section, st.sid);
      const grd = computeWeightedTotal(section, st.sid);
      body += `<tr><td>${i + 1}</td><td>${esc(st.id)}</td><td>${esc(st.name)}</td><td>${att.pct}%</td><td>${grd.total}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.attendance) {
    body += "<h2>الحضور</h2>";
    if (section.sessions.length === 0) body += "<p>لا توجد جلسات مسجّلة.</p>";
    else {
      body += "<table><tr><th>الاسم</th>" + section.sessions.map((s) => `<th>${esc(s.label)}<br/>${esc(s.date)}</th>`).join("") + "</tr>";
      section.students.forEach((st) => {
        body += `<tr><td>${esc(st.name)}</td>` + section.sessions.map((s) => {
          const raw = section.attendance[`${s.id}:${st.sid}`];
          let display = "-";
          if (raw && typeof raw === "object") display = `${raw.status} (${raw.arrivalTime || "—"}، تأخر ${raw.lateMinutes || 0} د)`;
          else if (raw) display = raw;
          return `<td>${esc(display)}</td>`;
        }).join("") + "</tr>";
      });
      body += "</table>";
    }
  }

  if (sel.grades) {
    body += "<h2>الدرجات</h2><table><tr><th>الاسم</th>" + section.gradeItems.map((gi) => `<th>${esc(gi.name)} (${gi.weight}%)</th>`).join("") + "<th>الإجمالي الموزون</th></tr>";
    section.students.forEach((st) => {
      const grd = computeWeightedTotal(section, st.sid);
      body += `<tr><td>${esc(st.name)}</td>` + section.gradeItems.map((gi) => `<td>${section.grades[`${gi.id}:${st.sid}`] ?? ""}</td>`).join("") + `<td>${grd.total}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.notes) {
    body += "<h2>الملاحظات</h2>";
    if (section.notes.length === 0) body += "<p>لا توجد ملاحظات.</p>";
    else {
      body += "<table><tr><th>الاسم</th><th>التاريخ</th><th>الملاحظة</th></tr>";
      section.notes.forEach((n) => {
        const st = section.students.find((s) => s.sid === n.studentSid);
        body += `<tr><td>${esc(st ? st.name : "—")}</td><td>${esc(n.date)}</td><td>${esc(n.text)}</td></tr>`;
      });
      body += "</table>";
    }
  }

  if (sel.contacts) {
    body += "<h2>التواصل</h2><table><tr><th>الاسم</th><th>الرقم الأكاديمي</th><th>البريد الإلكتروني</th><th>الجوال</th></tr>";
    section.students.forEach((st) => {
      body += `<tr><td>${esc(st.name)}</td><td>${esc(st.id)}</td><td dir="ltr" style="text-align:left">${esc(st.email || "-")}</td><td dir="ltr" style="text-align:left">${esc(st.phone || "-")}</td></tr>`;
    });
    body += "</table>";
  }

  if (sel.reports) {
    body += "<h2>تقرير ملخص</h2><table><tr><th>الاسم</th><th>نسبة الغياب</th><th>الدرجة الموزونة</th><th>عدد الملاحظات</th></tr>";
    section.students.forEach((st) => {
      const att = computeAttendancePct(section, st.sid);
      const grd = computeWeightedTotal(section, st.sid);
      const notesCount = section.notes.filter((n) => n.studentSid === st.sid).length;
      body += `<tr><td>${esc(st.name)}</td><td>${att.pct}%</td><td>${grd.total}</td><td>${notesCount}</td></tr>`;
    });
    body += "</table>";
  }

  return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>${styles}</style></head><body>${body}</body></html>`;
}

function ExportModal({ section, onClose }) {
  const [sel, setSel] = useState({ students: true, attendance: true, grades: true, notes: true, contacts: true, reports: true });
  const toggle = (k) => setSel((v) => ({ ...v, [k]: !v[k] }));
  const setAll = (val) => setSel({ students: val, attendance: val, grades: val, notes: val, contacts: val, reports: val });
  const anySelected = Object.values(sel).some(Boolean);
  const fileBase = (section.name || "تقرير_الشعبة").replace(/[\\/:*?"<>|]/g, "-");

  const items = [
    { key: "students", label: "المتدربون" },
    { key: "attendance", label: "الحضور" },
    { key: "grades", label: "الدرجات" },
    { key: "notes", label: "الملاحظات" },
    { key: "contacts", label: "التواصل" },
    { key: "reports", label: "التقارير" },
  ];

  const doExportWord = () => {
    if (!window.htmlDocx) { alert("تعذّر تحميل مكتبة تصدير Word، تحقق من اتصالك بالإنترنت وحاول مجددًا."); return; }
    const html = buildExportHTML(section, sel);
    const blob = window.htmlDocx.asBlob(html);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${fileBase}.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const doExportPDF = () => {
    const html = buildExportHTML(section, sel);
    const win = window.open("", "_blank");
    if (!win) { alert("يرجى السماح للنوافذ المنبثقة (Popups) في هذا الموقع، ثم حاول مجددًا."); return; }
    win.document.open();
    win.document.write(html.replace("</head>", `<style>
      @media print { @page { margin: 16mm; } }
      body { padding: 10px; }
    </style></head>`));
    win.document.close();
    win.onload = () => { win.focus(); win.print(); };
    // بعض المتصفحات لا تُطلق onload لنافذة مكتوبة عبر document.write بشكل موثوق
    setTimeout(() => { try { win.focus(); win.print(); } catch (e) {} }, 400);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(19,42,38,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div dir="rtl" className="modal-card" onClick={(e) => e.stopPropagation()} style={{ background: COLORS.paper, borderRadius: 18, maxWidth: 520, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 24, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.ink }}>تصدير تقرير</div>
          <IconBtn onClick={onClose} title="إغلاق"><Icon name="x" size={16} /></IconBtn>
        </div>
        <div style={{ fontSize: 12.5, color: COLORS.muted, margin: "8px 0 14px" }}>اختر الأقسام التي تريد تضمينها في الملف المُصدَّر:</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={() => setAll(true)} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>تحديد الكل</button>
          <button onClick={() => setAll(false)} style={{ ...ghostBtnStyle, padding: "5px 12px", fontSize: 12 }}>إلغاء التحديد</button>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
          {items.map((it) => (
            <label key={it.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderRadius: 9, border: `1px solid ${sel[it.key] ? COLORS.gold : COLORS.line}`, background: sel[it.key] ? "#F4E7C9" : COLORS.paperCard, cursor: "pointer" }}>
              <input type="checkbox" checked={sel[it.key]} onChange={() => toggle(it.key)} style={{ accentColor: COLORS.gold }} />
              <span style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.ink }}>{it.label}</span>
            </label>
          ))}
        </div>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button onClick={doExportWord} disabled={!anySelected} style={{ ...primaryBtnStyle, opacity: anySelected ? 1 : 0.5 }}>
            <Icon name="download" size={15} /> تصدير Word
          </button>
          <button onClick={doExportPDF} disabled={!anySelected} style={{ ...ghostBtnStyle, opacity: anySelected ? 1 : 0.5 }}>
            <Icon name="download" size={15} /> تصدير PDF
          </button>
        </div>
        <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 10 }}>
          سيفتح تصدير PDF نافذة طباعة المتصفح — اختر «حفظ كـ PDF» (Save as PDF) من قائمة الطابعات لحفظه كملف.
        </div>
      </div>
    </div>
  );
}

function GuideFab({ onOpen }) {
  return (
    <button
      onClick={onOpen}
      className="guide-fab"
      title="دليل استخدام التطبيق"
      style={{
        position: "fixed", bottom: 22, left: 18, zIndex: 90,
        display: "flex", alignItems: "center", gap: 8,
        padding: "12px 18px", borderRadius: 999, border: "none", cursor: "pointer",
        background: COLORS.gold, color: COLORS.ink, fontWeight: 800, fontSize: 14,
        boxShadow: "0 8px 22px rgba(185,134,47,0.55), 0 2px 6px rgba(0,0,0,0.25)",
      }}
    >
      <span className="guide-fab-ring" />
      <Icon name="clipboard" size={19} />
      دليل الاستخدام
    </button>
  );
}

function App() {
  const { data, setData, status, saving } = useStorage();
  const [activeSectionId, setActiveSectionId] = useState(null);
  const [tab, setTab] = useState("students");
  const [studentDetail, setStudentDetail] = useState(null);
  const [showSectionMgr, setShowSectionMgr] = useState(false);
  const [showGuide, setShowGuide] = useState(false);
  const [showExport, setShowExport] = useState(false);

  useEffect(() => {
    if (data && !activeSectionId && data.sections.length) setActiveSectionId(data.sections[0].id);
  }, [data, activeSectionId]);

  const section = useMemo(() => data?.sections.find((s) => s.id === activeSectionId) || null, [data, activeSectionId]);

  const updateSection = useCallback((patchFn) => {
    if (!data || !section) return;
    const nextSections = data.sections.map((s) => (s.id === section.id ? patchFn(s) : s));
    setData({ ...data, sections: nextSections });
  }, [data, section, setData]);

  const importInputRef = useRef(null);

  const exportBackup = () => {
    if (!data) return;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `نسخة-احتياطية-دفتر-المتابعة-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importBackup = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.sections)) throw new Error("bad format");
      setData(parsed);
      setActiveSectionId(parsed.sections[0]?.id || null);
    } catch (err) {
      alert("تعذّر استيراد الملف. تأكد أنه ملف نسخة احتياطية صحيح تم تصديره من هذا التطبيق.");
    } finally {
      e.target.value = "";
    }
  };

  if (status === "loading" || !data) {
    return <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}><div style={{ color: COLORS.paper, fontSize: 15 }}>...جارِ فتح دفتر المتابعة</div></div>;
  }
  if (status === "error") {
    return <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}><div style={{ color: "#F7E8E6" }}>تعذّر تحميل البيانات. حاول تحديث الصفحة.</div></div>;
  }

  return (
    <div dir="rtl" style={shellStyle}>
      <GuideFab onOpen={() => setShowGuide(true)} />
      <TopBar
        saving={saving} section={section} sections={data.sections} onSwitch={setActiveSectionId}
        onManage={() => setShowSectionMgr(true)} onExport={exportBackup}
        onImportClick={() => importInputRef.current?.click()}
        onOpenReportExport={() => setShowExport(true)}
      />
      <input ref={importInputRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importBackup} />
      <BackupBanner onExport={exportBackup} />
      {section && (
        <div className="app-container" style={{ maxWidth: 1180, margin: "0 auto", padding: "22px 22px 60px" }}>
          <SectionHeader section={section} />
          <Tabs tab={tab} setTab={setTab} />
          {tab === "students" && <StudentsTab section={section} updateSection={updateSection} onOpenStudent={setStudentDetail} />}
          {tab === "attendance" && <AttendanceTab section={section} updateSection={updateSection} />}
          {tab === "grades" && <GradesTab section={section} updateSection={updateSection} />}
          {tab === "notes" && <NotesTab section={section} updateSection={updateSection} />}
          {tab === "contacts" && <ContactsTab section={section} updateSection={updateSection} />}
          {tab === "calendar" && <CalendarTab section={section} updateSection={updateSection} />}
          {tab === "reports" && <ReportsTab section={section} onOpenStudent={setStudentDetail} />}
        </div>
      )}
      {studentDetail && section && <StudentDetailModal section={section} studentSid={studentDetail} onClose={() => setStudentDetail(null)} />}
      {showSectionMgr && (
        <SectionManagerModal data={data} setData={setData} activeSectionId={activeSectionId} setActiveSectionId={setActiveSectionId} onClose={() => setShowSectionMgr(false)} />
      )}
      {showGuide && <GuideModal onClose={() => setShowGuide(false)} />}
      {showExport && section && <ExportModal section={section} onClose={() => setShowExport(false)} />}
      <div style={{ textAlign: "center", padding: "18px 10px 26px", fontSize: 12.5, color: COLORS.muted }}>
        إعداد: كليب بن أحمد بن ضيف الله الزهراني
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
<script>
  // نحوّل كود JSX يدويًا باستخدام "classic runtime" حتى لا يولّد Babel
  // عبارات import (react/jsx-runtime) التي تفشل في المتصفح كملف عادي (غير module)
  (function () {
    try {
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.text = out;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:40px;font-family:sans-serif;direction:rtl;color:#A63B34;">' +
        "حدث خطأ أثناء تشغيل التطبيق: " + (e && e.message ? e.message : e) + "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
